function pageArrears(){
  const isAdmin = state.staff.role === 'admin';
  const myGroupIds = isAdmin ? [] : state.data.groups.filter(g => g.officer_id === state.staff.id).map(g => g.id);
  const { start: drStart, end: drEnd } = arrearDateRange();

  // Active loans matching visibility rules AND start_date within selected range
  const activeLoans = state.data.loans.filter(l =>
    l.status === 'active'
    && l.start_date >= drStart && l.start_date <= drEnd
    && (isAdmin || myGroupIds.includes(l.group_id) || l.officer_id === state.staff.id)
  );

  const today = todayISO();
  const msPerWeek = 7 * 24 * 3600 * 1000;
  const nextWeekISO = new Date(new Date(today).getTime() + 7*24*3600*1000).toISOString().slice(0,10);

  const report = activeLoans.map(l => {
    const mem = state.data.members.find(x => x.id === l.member_id);
    const g   = state.data.groups.find(x => x.id === l.group_id);
    const off = state.data.staff.find(x => x.id === l.officer_id);
    const paid = loanPaid(l.id);

    const weekly = Number(l.weekly_installment) || 0;
    const arrears = loanArrearsAsOf(l, today);
    const penalty = 0;
    const overdueWeeks = 0;

    // Determine next upcoming due date (the next installment date after today)
    let nextDueDate = loanNextDueDate(l, today);

    // Category: a loan is "duetoday" if the next due date is exactly today AND there are no arrears
    let category = 'ontrack';
    if (arrears > 0) category = 'arrears';
    else if (nextDueDate === today) category = 'duetoday';
    else if (nextDueDate && nextDueDate <= nextWeekISO) category = 'duethisweek';

    return { loan: l, member: mem, group: g, officer: off, paid, arrears, penalty, overdueWeeks, nextDueDate, expectedInstallment: weekly, expectedCollection: loanExpectedCollectionAsOf(l, today), category };
  });

  const tab = state._arrearsTab || 'arrears';
  const offFilter = state._arrearsOfficerFilter || '';
  const grpFilter = state._arrearsGroupFilter || '';

  // Strict separation: each bucket is mutually exclusive
  // arrears:     paid < expected (overdue) - regardless of next due date
  // duetoday:    arrears === 0 AND next installment is exactly today
  // duethisweek: arrears === 0 AND next installment is within next 7 days (but not today)
  const arrearsLoans     = report.filter(r => r.arrears > 0);
  const duetodayLoans    = report.filter(r => r.arrears === 0 && r.category === 'duetoday');
  const duethisweekLoans = report.filter(r => r.arrears === 0 && r.category === 'duethisweek');

  let filtered = tab === 'arrears'     ? arrearsLoans
               : tab === 'duetoday'    ? duetodayLoans
               : tab === 'duethisweek' ? duethisweekLoans
               : report; // 'all'

  if (isAdmin && offFilter) filtered = filtered.filter(r => r.loan.officer_id === offFilter);
  if (grpFilter) filtered = filtered.filter(r => r.loan.group_id === grpFilter);

  const officersWithLoans = isAdmin
    ? state.data.staff.filter(s => s.role === 'officer' && report.some(r => r.loan.officer_id === s.id))
    : [];

  // Groups visible to this user
  const visibleGroups = isAdmin
    ? state.data.groups
    : state.data.groups.filter(g => myGroupIds.includes(g.id));

  const filterBtns = [
    ['all','All Time'],['week','Last 7 Days'],['month','Last Month'],['3months','Last 3 Months'],['6months','Last 6 Months'],['custom','Custom']
  ];

  // Column count helper
  const colCount = isAdmin ? 9 : 8;

  $('page').innerHTML = `
    <div class="page-head">
      <div>
        <h1>Due &amp; Arrears</h1>
        <div class="desc">Track missed payments and upcoming collections.</div>
      </div>
      <div class="actions">
        <button class="btn btn-outline btn-sm" onclick="openCollectionSheetModal()" title="Export today's collection sheet"> Collection Sheet</button>
      </div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span style="font-size:12px;color:var(--text-muted);margin-right:2px">Loan start date:</span>
      ${filterBtns.map(([k,l]) => `<button class="btn btn-sm ${_arrearsFilter===k?'btn-primary':'btn-outline'}" onclick="_arrearsFilter='${k}';pageArrears()">${l}</button>`).join('')}
      ${_arrearsFilter==='custom' ? `

           Due Today (${duetodayLoans.length})

           Due Next 7 Days (${duethisweekLoans.length})

          <select style="max-width:200px;font-size:13px" onchange="state._arrearsOfficerFilter=this.value;pageArrears()">
            <option value="">All Officers</option>
            ${officersWithLoans.map(o=>`<option value="${o.id}" ${offFilter===o.id?'selected':''}>${o.full_name}</option>`).join('')}

    ${tab==='arrears' ? `

    </div>` : ''}
    ${tab==='duetoday' ? `
    <div style="background:#fffbeb;border:1px solid var(--warning);border-radius:var(--radius-sm);padding:8px 14px;font-size:12px;color:#92400e;margin-bottom:8px">
       <b>Due Today</b> - these clients have a scheduled payment <b>today</b> and are currently up to date. They do <b>not</b> have arrears.
    </div>` : ''}

    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th class="sticky-name">Member</th><th>Group</th>${isAdmin?'<th>Officer</th>':''}
          <th>Loan product</th><th>Start Date</th>
          <th class="num">${tab==='arrears'?'Expected Collection (KES)':'Amount Due (KES)'}</th>
          <th class="num">Weekly Inst.</th>
          <th>Next Due Date</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${filtered.length ? filtered.map(r => {
            const amountDisplay = tab==='arrears' ? r.expectedCollection : r.expectedInstallment;
            const statusBadge   = tab==='arrears'     ? '<span class="badge b-red">In Arrears</span>'
                                : tab==='duetoday'    ? '<span class="badge b-yellow">Due Today</span>'
                                : tab==='duethisweek' ? '<span class="badge b-green">Due Soon</span>'
                                : r.arrears>0         ? '<span class="badge b-red">In Arrears</span>'
                                : r.category==='duetoday' ? '<span class="badge b-yellow">Due Today</span>'
                                : '<span class="badge b-green">On Track</span>';
            const amtColor = tab==='arrears'?'var(--danger)':tab==='duetoday'?'var(--warning)':'var(--success)';
            return `<tr>
              <td class="sticky-name"><b>${r.member?.full_name||' - '}</b><div class="muted" style="font-size:11px">${r.member?.phone||''}</div></td>

              ${isAdmin ? `<td style="font-size:12px">${r.officer?.full_name||' - '}</td>` : ''}

              <td>${fmtDate(r.loan.start_date)}</td>
              <td class="num"><b style="color:${amtColor}">${KES(amountDisplay)}</b></td>
              <td class="num">${KES(r.expectedInstallment)}</td>
              <td>${fmtDate(r.nextDueDate)}</td>
              <td>${statusBadge}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="${colCount}"><div class="empty"><h4>No records found</h4><p>${
            tab==='arrears'?'No loans are currently in arrears - great!':
            tab==='duetoday'?'No loans are due today.':
            tab==='duethisweek'?'No loans due in the next 7 days.':
            'No active loans match the current filters.'
          }</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  // Fix year-typing: attach event listeners for custom date range
  const arrStartEl = document.getElementById('arr-custom-start');
  const arrEndEl = document.getElementById('arr-custom-end');
  if(arrStartEl) arrStartEl.addEventListener('change', e => { _arrearsCustomStart = e.target.value; pageArrears(); });
  if(arrEndEl) arrEndEl.addEventListener('change', e => { _arrearsCustomEnd = e.target.value; pageArrears(); });
}
function pageLoans(){
  const isAdmin = state.staff.role === 'admin';
  const myGroupIds = isAdmin ? [] : state.data.groups.filter(g => g.officer_id === state.staff.id).map(g => g.id);

  // Compute loan date range
  const loanDateRange = () => {
    const now = new Date();
    const iso = d => d.toISOString().slice(0,10);
    const today = iso(now);
    if(_loanDateFilter==='all') return { start: '2000-01-01', end: '2999-12-31' };
    if(_loanDateFilter==='today') return { start: today, end: today };
    if(_loanDateFilter==='yesterday'){ const y=new Date(now); y.setDate(y.getDate()-1); const yd=iso(y); return { start:yd, end:yd }; }
    if(_loanDateFilter==='week'){ const d=new Date(now); d.setDate(d.getDate()-6); return { start:iso(d), end:today }; }
    if(_loanDateFilter==='month'){ const d=new Date(now); d.setMonth(d.getMonth()-1); return { start:iso(d), end:today }; }
    if(_loanDateFilter==='3months'){ const d=new Date(now); d.setMonth(d.getMonth()-3); return { start:iso(d), end:today }; }
    if(_loanDateFilter==='custom'){ return { start:_loanCustomStart||today, end:_loanCustomEnd||today }; }
    return { start:'2000-01-01', end:'2999-12-31' };
  };
  const { start: ldrStart, end: ldrEnd } = loanDateRange();

  let loans = isAdmin
    ? state.data.loans
    : state.data.loans.filter(l => myGroupIds.includes(l.group_id) || l.officer_id === state.staff.id);

  const tab = state._loanTab || 'active';
  loans = loans.filter(l => tab==='all' ? true : l.status===tab);

  // Apply date filter on start_date
  loans = loans.filter(l => {
    const sd = (l.start_date||'').slice(0,10);
    return sd >= ldrStart && sd <= ldrEnd;
  });

  if (isAdmin && state._loanOfficerFilter) {
    loans = loans.filter(l => l.officer_id === state._loanOfficerFilter);
  }

  // Fix 11: Group filter for loans
  if (state._loanGroupFilter) {
    loans = loans.filter(l => l.group_id === state._loanGroupFilter);
  }

  const visibleGroups = isAdmin
    ? state.data.groups
    : state.data.groups.filter(g => myGroupIds.includes(g.id));

  const loanFilterBtns = [
    ['all','All Time'],['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','Last Month'],['3months','Last 3 Months'],['custom','Custom']
  ];

  // ---- Group summary data (computed before rendering) ----
  // For each group that has loans in the current filtered set, compute
  // total savings, total outstanding, total loan value, and member count.
  const groupsWithLoans = visibleGroups.filter(g =>
    loans.some(l => l.group_id === g.id)
  );

  const groupSummary = groupsWithLoans.map(g => {
    const gLoans = loans.filter(l => l.group_id === g.id);
    const totalLoanValue = gLoans.reduce((a,l) => a + Number(l.loan_value||0), 0);
    const totalOutstanding = gLoans.reduce((a,l) => a + Math.max(0, Number(l.total_payable||0) - loanPaid(l.id)), 0);
    const totalPaid = gLoans.reduce((a,l) => a + loanPaid(l.id), 0);
    const totalSavings = state.data.savings
      .filter(s => s.group_id === g.id && s.status !== 'rejected' && (!s.type || s.type === 'savings'))
      .reduce((a,s) => a + Number(s.amount||0), 0);
    const memberCount = new Set(gLoans.map(l=>l.member_id)).size;
    const off = state.data.staff.find(s => s.id === g.officer_id);
    // Health ratio: savings / outstanding (>1 = saves more than owes, <1 = owes more than saves)
    const ratio = totalOutstanding > 0 ? totalSavings / totalOutstanding : totalSavings > 0 ? 99 : 0;
    const health = ratio >= 1 ? 'good' : ratio >= 0.5 ? 'warn' : 'poor';
    return { g, gLoans, totalLoanValue, totalOutstanding, totalPaid, totalSavings, memberCount, off, ratio, health };
  }).sort((a,b) => b.totalOutstanding - a.totalOutstanding);

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Cash loan portfolio</h1><div class="desc">Cycle-based cash loans issued to group members.</div></div>
      ${(isAdmin||state.perms?.can_issue_loans) ? `<div class="actions"><button class="btn btn-primary" onclick="openCashLoan()">${loanIcon()} Issue cash loan</button></div>` : ''}
    </div>
    <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
      <div class="tabs" style="margin-bottom:0; border-bottom:none;">
        ${['active','completed','defaulted','all'].map(t => `<button class="${tab===t?'active':''}" onclick="state._loanTab='${t}';pageLoans()">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}
      </div>

        <div style="position:relative;min-width:220px">
          <input id="loan-grp-search" type="text" placeholder="Search group name..."
            value="${state._loanGroupFilter ? (visibleGroups.find(g=>g.id===state._loanGroupFilter)?.name||'') : ''}"

            style="width:100%;padding:7px 12px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />
          <div id="loan-grp-drop" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);z-index:99;max-height:220px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.12)"></div>
        </div>
        ${isAdmin ? `
        <select style="max-width:200px" onchange="state._loanOfficerFilter=this.value; pageLoans()">
          <option value="">All Officers</option>
          ${state.data.staff.filter(s=>s.role==='officer').map(o=>`<option value="${o.id}" ${state._loanOfficerFilter===o.id?'selected':''}>${o.full_name}</option>`).join('')}
        </select>
        ` : ''}
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span style="font-size:12px;color:var(--text-muted);margin-right:2px">Start date:</span>
      ${loanFilterBtns.map(([k,l])=>`<button class="btn btn-sm ${_loanDateFilter===k?'btn-primary':'btn-outline'}" onclick="_loanDateFilter='${k}';pageLoans()">${l}</button>`).join('')}
      ${_loanDateFilter==='custom'?`
        <input type="date" id="loan-custom-start" value="${_loanCustomStart}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />
        <span class="muted" style="font-size:12px">to</span>
        <input type="date" id="loan-custom-end" value="${_loanCustomEnd}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />
      `:''}
    </div>

    ${groupSummary.length > 1 && !state._loanGroupFilter ? `
    <div style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em">
        Group Overview - ${groupSummary.length} groups - click a group to filter
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">
        ${groupSummary.map(({g, totalLoanValue, totalOutstanding, totalPaid, totalSavings, memberCount, off, ratio, health}) => {
          const barW = Math.min(100, totalOutstanding > 0 ? (totalSavings / (totalSavings + totalOutstanding)) * 100 : 100);
          const healthColor = health==='good' ? 'var(--success)' : health==='warn' ? 'var(--warning)' : 'var(--danger)';
          const healthLabel = health==='good' ? 'Healthy' : health==='warn' ? 'Watch' : 'At Risk';
          return `<div class="card card-pad" style="cursor:pointer;transition:box-shadow .15s"
              onclick="state._loanGroupFilter='${g.id}';pageLoans()"
              onmouseenter="this.style.boxShadow='0 4px 16px rgba(0,0,0,.12)'"
              onmouseleave="this.style.boxShadow=''">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
              <div>
                <div style="font-weight:700;font-size:14px">${g.name}</div>
                <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${memberCount} member(s) with loans${off?` - ${off.full_name}`:''}</div>
              </div>
              <span style="font-size:11px;font-weight:600;color:${healthColor};white-space:nowrap;margin-left:8px">${healthLabel}</span>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">
              <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px">
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase">Total Savings</div>
                <div style="font-weight:700;font-size:14px;color:var(--success)">${KES(totalSavings)}</div>
              </div>
              <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px">
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase">Outstanding Loans</div>
                <div style="font-weight:700;font-size:14px;color:var(--danger)">${KES(totalOutstanding)}</div>
              </div>
              <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px">
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase">Total Loaned</div>
                <div style="font-weight:600;font-size:13px">${KES(totalLoanValue)}</div>
              </div>
              <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px">
                <div style="font-size:10px;color:var(--text-muted);margin-bottom:2px;text-transform:uppercase">Total Repaid</div>
                <div style="font-weight:600;font-size:13px;color:var(--info)">${KES(totalPaid)}</div>
              </div>
            </div>

            <div style="margin-bottom:4px">
              <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:4px">
                <span>Savings vs Outstanding</span>
                <span>${ratio >= 99 ? 'No outstanding loans' : (ratio*100).toFixed(0)+'% covered by savings'}</span>
              </div>
              <div style="height:8px;border-radius:4px;background:var(--danger);overflow:hidden">
                <div style="height:100%;width:${barW}%;background:var(--success);border-radius:4px;transition:width .3s"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:3px">
                <span style="color:var(--success)"> Savings</span>
                <span style="color:var(--danger)"> Outstanding</span>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

    ${state._loanGroupFilter && groupSummary.length === 1 ? (() => {
      const {g, totalLoanValue, totalOutstanding, totalPaid, totalSavings, memberCount, ratio, health} = groupSummary[0];
      const healthColor = health==='good' ? 'var(--success)' : health==='warn' ? 'var(--warning)' : 'var(--danger)';
      const healthLabel = health==='good' ? 'Healthy' : health==='warn' ? 'Watch' : 'At Risk';
      const barW = Math.min(100, totalOutstanding > 0 ? (totalSavings / (totalSavings + totalOutstanding)) * 100 : 100);
      return `
      <div class="card card-pad" style="margin-bottom:16px;border-left:4px solid ${healthColor}">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
          <div>
            <div style="font-weight:700;font-size:15px">${g.name} <span style="font-size:12px;color:${healthColor};margin-left:6px">${healthLabel}</span></div>
            <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${memberCount} member(s) with loans</div>
          </div>
          <button class="btn btn-outline btn-sm" onclick="state._loanGroupFilter='';pageLoans()">Clear  Clear filter</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px">
          <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:10px"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Total Savings</div><div style="font-weight:700;font-size:15px;color:var(--success)">${KES(totalSavings)}</div></div>
          <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:10px"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Outstanding</div><div style="font-weight:700;font-size:15px;color:var(--danger)">${KES(totalOutstanding)}</div></div>
          <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:10px"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Total Loaned</div><div style="font-weight:600;font-size:14px">${KES(totalLoanValue)}</div></div>
          <div style="background:var(--surface-2);border-radius:var(--radius-sm);padding:10px"><div style="font-size:10px;color:var(--text-muted);text-transform:uppercase">Total Repaid</div><div style="font-weight:600;font-size:14px;color:var(--info)">${KES(totalPaid)}</div></div>
        </div>
        <div style="margin-top:10px">
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:4px">
            <span>Savings vs Outstanding</span>
            <span>${ratio >= 99 ? 'No outstanding loans' : (ratio*100).toFixed(0)+'% covered by savings'}</span>
          </div>
          <div style="height:10px;border-radius:5px;background:var(--danger);overflow:hidden">
            <div style="height:100%;width:${barW}%;background:var(--success);border-radius:5px"></div>
          </div>
        </div>
      </div>`;
    })() : ''}

    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th class="sticky-name">Member</th><th>Group</th><th>Loan product</th>${isAdmin?'<th>Officer</th>':''}<th>Start Date</th><th>Next Due</th><th class="num">Cash issued</th>
          <th class="num">Weekly</th><th class="num">Arrears</th><th class="num">Expected Now</th><th class="num">Paid</th><th class="num">Outstanding</th><th>Performance</th>
          <th>Status</th><th></th>
        </tr></thead>
        <tbody>
          ${loans.map(l => {
            const m = state.data.members.find(x=>x.id===l.member_id);
            const grp = state.data.groups.find(x=>x.id===l.group_id);
            const off = state.data.staff.find(x=>x.id===l.officer_id);
            const paid = loanPaid(l.id);
            const out = Number(l.total_payable)-paid;
            const perf = loanPerformance(l);
            const nextDue = loanNextDueDate(l);
            const arrears = loanArrearsAsOf(l);
            const expectedNow = loanExpectedCollectionAsOf(l);
            const bcls = l.status==='completed'?'b-grey':l.status==='defaulted'?'b-red':'b-blue';
            return `<tr style="${l.status==='completed'?'background:var(--surface-2);color:var(--text-muted)':l.status==='defaulted'?'background:var(--danger-50)':''}">
              <td class="sticky-name"><b>${m?.full_name||' - '}</b></td>
              <td>${grp?.name||' - '}</td>
              <td>${loanLabel(l)}</td>
              ${isAdmin ? `<td style="font-size:12px;color:var(--text-muted)">${off?.full_name||' - '}</td>` : ''}
              <td>${fmtDate(l.start_date)}</td>
              <td>${fmtDate(nextDue)}</td>
              <td class="num">${KES(l.loan_value)}</td>
              <td class="num">${KES(l.weekly_installment)}</td>
              <td class="num"><b style="color:${arrears>0?'var(--danger)':'var(--text-muted)'}">${KES(arrears)}</b></td>
              <td class="num"><b>${KES(expectedNow)}</b></td>
              <td class="num">${KES(paid)}</td>

            </tr>`;
          }).join('') || `<tr><td colspan="${isAdmin?15:14}"><div class="empty"><h4>No cash loans found</h4><p>Issue a loan after confirming the member's savings and cycle eligibility.</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  // Attach listeners for custom date range inputs (avoids year-typing issue)
  const loanStartEl = document.getElementById('loan-custom-start');
  const loanEndEl = document.getElementById('loan-custom-end');
  if(loanStartEl) loanStartEl.addEventListener('change', e => { _loanCustomStart = e.target.value; pageLoans(); });
  if(loanEndEl) loanEndEl.addEventListener('change', e => { _loanCustomEnd = e.target.value; pageLoans(); });

  // Group live search
  const loanGrpSearch = document.getElementById('loan-grp-search');
  const loanGrpDrop = document.getElementById('loan-grp-drop');
  if(loanGrpSearch && loanGrpDrop){

  const officers = state.data.staff.filter(s => s.role === 'officer' && s.status === 'active');
  if(!officers.length){ toast('No active loan officers found to transfer to.','warn'); return; }
  const currentOfficer = state.data.staff.find(s => s.id === l.officer_id);
  const optionsHtml = officers.map(function(o){
    const dis = o.id === l.officer_id ? ' disabled' : '';

function openLoanRestructure(l){
  const paid = loanPaid(l.id);
  const outstanding = Number(l.total_payable) - paid;

  modal({
    title: 'Restructure Loan - ' + loanLabel(l),
    body: '<div style="font-size:13px;color:var(--text-muted);margin-bottom:14px">'
        + 'Adjust the weekly installment to recalculate the remaining repayment schedule.'
        + '<br><b>Current Weekly:</b> ' + KES(l.weekly_installment)
        + '<br><b>Outstanding Balance:</b> ' + KES(outstanding)
        + '</div>'
        + '<div class="field"><label>New Weekly Installment (KES) *</label>'
        + '<input type="number" id="lr-weekly" min="1" value="' + l.weekly_installment + '" required /></div>'
        + '<div class="field"><label>Effective Date *</label>'
        + '<input type="date" id="lr-date" value="' + todayISO() + '" required /></div>'
        + '<div class="field"><label>Reason for Restructure</label>'
        + '<textarea id="lr-reason" rows="2" placeholder="e.g. Member requested lower payments due to hardship..."></textarea></div>',
    actions: [
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: 'Apply Restructure', cls: 'btn-primary', onClick: async function() {
        const newWeekly = Number(document.getElementById('lr-weekly').value);
        const effectiveDateVal = document.getElementById('lr-date').value;
        const reason = document.getElementById('lr-reason').value.trim();

        if(!newWeekly || newWeekly <= 0) return toast('Invalid weekly amount.', 'error');

        const effectiveDate = new Date(effectiveDateVal);
        const remainingWeeks = Math.ceil(outstanding / newWeekly);
        const end = new Date(effectiveDate);
        end.setDate(end.getDate() + 7 * remainingWeeks);
        const expectedEnd = end.toISOString().slice(0,10);

        const oldWeekly = l.weekly_installment;
        const upd = {
          weekly_installment: newWeekly,
          expected_end_date: expectedEnd
        };

        const { error } = await sb.from('rh_loans').update(upd).eq('id', l.id);
        if(error) return toast('Failed to update loan: ' + error.message, 'error');

        Object.assign(l, upd);
        // Restructure reason is stored in the audit log (rh_loans has no notes column)
        audit('loan_restructure', 'rh_loans', l.id, { old_weekly: oldWeekly }, { new_weekly: newWeekly, expected_end_date: expectedEnd, reason });
        closeModal();
        render();
        toast('Loan restructured successfully.', 'success');
      }}
    ]
  });
}
function showLoanSchedule(l){
  const principal=Number(l.loan_value)||0, total=Number(l.total_payable)||principal;
  const weeks=Number(l.term_weeks)||Math.max(1,Math.ceil(total/Math.max(1,Number(l.weekly_installment)||1)));
  const principalPart=principal/weeks, interestPart=(total-principal)/weeks;
  let balance=total;
  const sched={rows:Array.from({length:weeks},(_,idx)=>{
    const due=new Date(l.start_date); due.setDate(due.getDate()+7*(idx+1));
    const installment=idx===weeks-1?balance:Number(l.weekly_installment)||total/weeks;
    balance=Math.max(0,balance-installment);
    return {w:idx+1,due,principal:principalPart,interest:interestPart,installment,balance};
  })};
  modal({
    title:`Repayment schedule - ${loanLabel(l)}`,
    size:'lg',
    body:`<div class="table-wrap"><table class="tbl">
      <thead><tr><th>Wk</th><th>Due</th><th class="num">Principal</th><th class="num">Interest</th><th class="num">Installment</th><th class="num">Balance</th></tr></thead>
      <tbody>${sched.rows.map(r=>`<tr><td>${r.w}</td><td>${fmtDate(r.due)}</td><td class="num">${KES(r.principal)}</td><td class="num">${KES(r.interest)}</td><td class="num">${KES(r.installment)}</td><td class="num">${KES(r.balance)}</td></tr>`).join('')}</tbody>
    </table></div>`,
    actions:[{ label:'Close', cls:'btn-primary', onClick: closeModal }]
  });
}

function computeSchedule(loan){
  const principal=Number(loan.loan_value)||0;
  const totalPayable=Number(loan.total_payable)||principal;
  const totalInterest=Number(loan.interest_amount)||(totalPayable-principal);
  const weeks=Number(loan.term_weeks)||1;
  const weekly=Number(loan.weekly_installment)||(totalPayable/weeks);
  const principalPart=principal/weeks, interestPart=totalInterest/weeks;
  let balance=totalPayable;
  const rows=Array.from({length:weeks},(_,idx)=>{
    const due=new Date(loan.start_date); due.setDate(due.getDate()+7*(idx+1));
    const installment=idx===weeks-1?balance:Math.min(weekly,balance);
    balance=Math.max(0,balance-installment);
    return {w:idx+1,due,principal:principalPart,interest:interestPart,installment,balance};
  });
  return {weeks,totalInterest,totalPayable,suggestedWeekly:weekly,rows};
}

function staffActions(ev, id){
  const s = state.data.staff.find(x=>x.id===id);
  showActMenu(ev, [
    { label:'Edit details', onClick: ()=>openStaffForm(s) },
    { label:s.status==='active'?'Deactivate':'Reactivate', onClick: async ()=>{
      const ns = s.status==='active'?'inactive':'active';
      await sb.from('rh_staff').update({ status: ns }).eq('id', id);
      s.status = ns; render(); toast('Staff status updated','success');
    }},
    { label:'Delete & Reset Auth', danger:true, onClick: async ()=>{
      if(!confirm('PERMANENTLY delete this staff member and their login?')) return;
      let error;
      if(s.auth_user_id){
        const { error: rpcErr } = await sb.rpc('rh_delete_staff_auth', { target_user_id: s.auth_user_id });
        error = rpcErr;
      } else {
        const { error: delErr } = await sb.from('rh_staff').delete().eq('id', id);
        error = delErr;
      }
      if(error) return toast(error.message, 'error');
      state.data.staff = state.data.staff.filter(x=>x.id!==id);
      audit('delete_staff','rh_staff',id);
      render();
      toast('Staff member deleted and auth account removed.','success');
    }}
  ]);
}
function openStaffForm(s=null){
  modal({
    title: s?'Edit staff member':'Add loan officer',
    body:`<form id="sf">
      <div class="field"><label>Full name *</label><input name="full_name" value="${s?.full_name||''}" required /></div>
      <div class="field"><label>Email *</label><input type="email" name="email" value="${s?.email||''}" required ${s?'disabled':''} /></div>
      <div class="field"><label>Phone</label><input name="phone" value="${s?.phone||''}" /></div>
      ${!s ? `<div class="field"><label>Initial password *</label><input type="password" name="password" minlength="6" required /><div class="helper">The officer can change this after first sign-in.</div></div>`:''}
      <div class="field"><label>Role</label>
        <select name="role" ${s?'disabled':''}>
          <option value="officer" ${s?.role==='officer'?'selected':''}>Loan Officer</option>
          <option value="admin" ${s?.role==='admin'?'selected':''}>Administrator</option>
        </select>
      </div>
    </form>`,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label: s?'Save':'Create account', cls:'btn-primary', onClick: async () => {
        const fd = new FormData($('sf')); const row = Object.fromEntries(fd);
        if(s){
          const upd = { full_name: row.full_name, phone: row.phone||null };
          const { error } = await sb.from('rh_staff').update(upd).eq('id', s.id);
          if(error) return toast(error.message,'error');
          Object.assign(s, upd); audit('update','rh_staff',s.id);
          closeModal(); render(); toast('Staff updated','success'); return;
        }
        // Create auth user via admin client (does NOT log out current user)
        const { data, error } = await sbAdmin.auth.signUp({ email: row.email.toLowerCase(), password: row.password, options: { emailRedirectTo: authRedirectUrl() } });
        if(error) return toast(error.message,'error');
        const auth_user_id = data.user?.id || null;
        const ins = { auth_user_id, business_id: state.staff.business_id || null, full_name: row.full_name, email: row.email.toLowerCase(), phone: row.phone||null, role: row.role, status:'active' };
        const { data: created, error: e2 } = await sb.from('rh_staff').insert(ins).select().single();
        if(e2) return toast(e2.message,'error');
        await sb.from('rh_permissions').insert({ staff_id: created.id, business_id: state.staff.business_id });
        state.data.staff.unshift(created);
        audit('create_staff','rh_staff',created.id,null,ins);
        closeModal(); render(); toast('Staff account created. Officer must verify email before signing in.','success');
      }}
    ]
  });
}
async function editPerms(id){
  const s = state.data.staff.find(x=>x.id===id);

  const cur = p || { staff_id:id };

    ['can_manage_groups','Manage groups'],

    ['can_record_savings','Record savings'],

    ['can_issue_loans','Issue cash loans'],
    ['can_view_reports','View financial reports'],
    ['can_manage_staff','Manage staff and permissions']
  ];
  modal({
    title:`Permissions - ${s.full_name}`,
    body: flags.map(([k,l]) => `<div class="checkbox-row" style="padding:8px 0;border-bottom:1px solid var(--border)">
      <input type="checkbox" id="p-${k}" ${cur[k]?'checked':''} /><label for="p-${k}" style="margin:0">${l}</label>
    </div>`).join(''),
    actions:[
      { label:'Cancel', onClick: closeModal },

  });
}

async function ensurePin(){
  const pins = lsGet('pins', {});
  if(pins[state.staff.id]) return;
  modal({
    title:'Set your switch-user PIN',
    body:`<p class="muted" style="font-size:13px">Choose a 4-digit PIN to switch back to your account on this device without retyping your password.</p>
      <div class="field"><label>4-digit PIN</label><input id="np" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required /></div>`,
    actions:[
      { label:'Skip for now', onClick: closeModal },
      { label:'Save PIN', cls:'btn-primary', onClick: async () => {
        const v = ($('np').value||'').trim();
        if(!/^\d{4}$/.test(v)) return toast('PIN must be exactly 4 digits.','error');
        const h = await sha256(v + ':' + state.staff.id);
        const all = lsGet('pins', {}); all[state.staff.id] = { h, name: state.staff.full_name, role: state.staff.role };
        lsSet('pins', all);
        closeModal(); toast('PIN saved.','success');
      }}
    ]
  });
}
function openSwitchUser(){
  const pins = lsGet('pins', {});
  const ids = Object.keys(pins).filter(id => id !== state.staff.id);
  if(!ids.length){
    return modal({
      title:'Switch user',
      body:`<p>No other accounts have set a PIN on this device yet. Each officer must sign in normally once and then save a PIN from the prompt that follows their first sign-in.</p>`,
      actions:[{ label:'OK', cls:'btn-primary', onClick: closeModal }]
    });
  }
  modal({
    title:'Switch user',
    body:`<div class="field"><label>Select account</label>
      <select id="su-id">${ids.map(id => `<option value="${id}">${pins[id].name} - ${pins[id].role}</option>`).join('')}</select></div>
      <div class="field"><label>Enter PIN</label><input id="su-pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" /></div>`,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:'Switch', cls:'btn-primary', onClick: async () => {
        const id = $('su-id').value, pin = ($('su-pin').value||'').trim();
        const h = await sha256(pin + ':' + id);
        if(h !== pins[id].h) return toast('Incorrect PIN.','error');
        const target = state.data.staff.find(s=>s.id===id);
        if(!target) return toast('Staff record not found locally.','error');
        await audit('switch_user','auth', state.staff.id, null, { to: id });
        state.staff = target;
        const { data: perms } = await sb.from('rh_permissions').select('*').eq('staff_id', id).maybeSingle();
        state.perms = perms || {};
        closeModal(); render(); toast('Switched to ' + target.full_name, 'success');
      }}
    ]
  });
}

          const off = state.data.staff.find(x=>x.id===r.logged_by);
          const mc = r.amount_matched==='yes'
            ? '<span class="badge b-green"> Matches</span>'
            : r.amount_matched==='no'
            ? '<span class="badge b-red"> Differs</span>'
            : '<span class="badge b-grey">Pending</span>';
          const mpesaRef = r.mpesa_reference
            ? `<code style="font-family:monospace;font-size:11px;background:var(--surface-2);padding:1px 5px;border-radius:3px">${r.mpesa_reference}</code>`
            : '';
          const searchText = [g?.name, g?.group_code, off?.full_name, r.mpesa_reference, r.status].filter(Boolean).join(' ');
          return `<tr class="remittance-search-row" data-remittance-search="${escapeHtml(searchText.toLowerCase())}">
            <td>${fmtDate(r.meeting_date)}</td>
            <td>${g?.name||' - '}</td>
            <td style="font-size:12px;color:var(--text-muted)">${off?.full_name||' - '}</td>
            <td class="num">${KES(r.total_savings)}</td>
            <td class="num">${KES(r.total_repayments)}</td>
            <td class="num"><b>${KES(r.grand_total)}</b>${mpesaRef?`<div>${mpesaRef}</div>`:''}</td>
            <td>${mc}</td>
            <td><span class="badge ${r.status==='confirmed'?'b-green':'b-yellow'}">${r.status==='confirmed'?'Confirmed':'Pending'}</span></td>
            <td><button class="act-btn" onclick="reconActions(event,'${r.id}')"> - - - </button></td>
          </tr>`;
        }).join('')||`<tr><td colspan="9"><div class="empty"><h4>No remittances yet</h4><p>Loan officers log remittances after each meeting.</p></div></td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
}

function filterRemittanceRows(value){
  const query = String(value || '').trim().toLowerCase();
  const rows = [...document.querySelectorAll('.remittance-search-row')];
  let visible = 0;
  rows.forEach(row => {
    const matches = !query || String(row.dataset.remittanceSearch || '').includes(query);
    row.style.display = matches ? '' : 'none';
    if(matches) visible++;
  });
  const empty = $('remittance-search-empty');
  if(empty) empty.style.display = rows.length && !visible ? 'block' : 'none';
}

function setupReconGroupSearch(groups){
  const input = $('rec-group-search');
  const hidden = $('rec-group-id');
  const drop = $('rec-group-drop');
  if(!input || !hidden || !drop) return;
  const show = () => {
    const q = (input.value || '').trim().toLowerCase();
    const matches = groups
      .filter(g => !q || (g.name||'').toLowerCase().includes(q) || String(g.group_code||'').toLowerCase().includes(q))
      .slice(0, 20);
    drop.innerHTML = matches.length ? matches.map(g => `
      <div style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px"
        onmousedown="document.getElementById('rec-group-id').value='${g.id}';document.getElementById('rec-group-search').value='${(g.name||'').replace(/'/g,"\\'")}';document.getElementById('rec-group-drop').style.display='none';reconAutoTotals('${g.id}')">
        <b>${g.name}</b><span class="muted" style="font-size:11px;margin-left:6px">${g.meeting_day||''}${g.group_code?' - '+g.group_code:''}</span>
      </div>
    `).join('') : `<div style="padding:9px 12px;font-size:12px;color:var(--text-muted)">No groups found</div>`;
    drop.style.display = 'block';
  };
  input.addEventListener('focus', show);
  input.addEventListener('input', () => { hidden.value = ''; show(); });
  input.addEventListener('blur', () => setTimeout(()=>{ drop.style.display='none'; }, 200));
}

function reconMatchChanged(val){
  const wrap = $('rec-diff-wrap');
  if(wrap) wrap.style.display = val==='no' ? 'block' : 'none';
}

function renderReconPaymentChoices(preferredTxnId=''){
  const select = $('rec-mpesa-txn');
  const help = $('rec-mpesa-help');
  const groupId = $('rec-group-id')?.value || '';
  if(!select) return;
  const current = preferredTxnId || select.value;
  const candidates = groupId
    ? unlinkedGroupMpesaTransactions().filter(t=>t.group_id===groupId)
    : [];
  select.innerHTML = `<option value="">${groupId ? 'Select the M-Pesa receipt received for this group' : 'Select a group first'}</option>` +
    candidates.map(t=>`<option value="${t.id}" ${t.id===current?'selected':''}>${formatMpesaDateTime(t)} - ${t.trans_id||'No receipt'} - ${KES(t.amount)}</option>`).join('');
  if(help){
    help.textContent = !groupId
      ? 'Select a group to see its received, unreconciled payments.'
      : candidates.length
        ? `${candidates.length} received payment${candidates.length===1?'':'s'} awaiting a remittance log for this group.`
        : 'No unreconciled M-Pesa payment is available for this group.';
  }
  if(current && candidates.some(t=>t.id===current)){
    select.value = current;
    reconPaymentChanged();
  }
}

function reconPaymentChanged(){
  const txnId = $('rec-mpesa-txn')?.value;
  const txn = (state.data.mpesaTransactions||[]).find(t=>t.id===txnId);
  if(!txn) return;
  const received = Number(txn.amount)||0;
  const expected = Number($('rec-gt')?.value||0);
  const match = $('rec-match');
  const actual = $('rec-actual');
  if(actual) actual.value = received || '';
  if(match){
    match.value = Math.abs(received-expected) < 0.01 ? 'yes' : 'no';
    reconMatchChanged(match.value);
  }
}

function reconRecalc(){
  const sv = Number($('rec-sv')?.value||0);
  const rp = Number($('rec-rp')?.value||0);
  const total = sv + rp;
  if($('rec-gt')) $('rec-gt').value = total;
  if($('rec-sv-disp')) $('rec-sv-disp').textContent = KES(sv);
  if($('rec-rp-disp')) $('rec-rp-disp').textContent = KES(rp);
  if($('rec-gt-disp')) $('rec-gt-disp').textContent = KES(total);
  if($('rec-mpesa-txn')?.value) reconPaymentChanged();
}

function reconAutoTotals(groupId){
  const f = $('rec-f'); if(!f) return;
  const gid = groupId || f.querySelector('[name="group_id"]')?.value;
  const date = f.querySelector('[name="meeting_date"]')?.value;
  if(!gid || !date) return;
  const sv = state.data.savings
    .filter(s=>s.group_id===gid && s.meeting_date===date)
    .reduce((a,b)=>a+Number(b.amount||0),0);
  const rp = state.data.repayments
    .filter(r=>r.group_id===gid && r.meeting_date===date)
    .reduce((a,b)=>a+Number(b.amount||0),0);
  if($('rec-sv')) $('rec-sv').value = sv;
  if($('rec-rp')) $('rec-rp').value = rp;
  reconRecalc();
  renderReconPaymentChoices();
  if(sv>0||rp>0) toast(`Auto-filled: savings ${KES(sv)} + repayments ${KES(rp)} = ${KES(sv+rp)}`,'info');
  else toast('No meeting records found for this group and date.','warn');
}

  modal({
    title:'Confirm remittance received',
    body:`
      <div class="card card-pad" style="background:var(--surface-2);margin-bottom:16px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px">

          <div><div class="muted" style="font-size:11px">Meeting date</div><b>${fmtDate(r.meeting_date)}</b></div>
          <div><div class="muted" style="font-size:11px">Savings</div>${KES(r.total_savings)}</div>
          <div><div class="muted" style="font-size:11px">Repayments</div>${KES(r.total_repayments)}</div>
        </div>
        <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">

          <div style="font-weight:800;font-size:20px;color:var(--accent)">${KES(r.grand_total)}</div>
        </div>
        ${r.amount_matched==='no'?`<div style="margin-top:8px;padding:8px 10px;background:var(--danger-50);border-radius:var(--radius-sm);font-size:12px;color:var(--danger)">
          Warning:  Officer reported SMS amount differs${r.actual_sms_amount?' - SMS showed '+KES(r.actual_sms_amount):''}
        </div>`:''}
      </div>
      <div class="field">
        <label>M-Pesa reference from your Paybill statement</label>
         <input id="conf-ref" value="${escapeHtml(r.mpesa_reference||'')}" placeholder="e.g. QHJ4KL2MPX" style="font-family:monospace;letter-spacing:.05em" ${linkedTxn?'readonly':''} />
         <div class="helper">${linkedTxn?'This receipt was selected from the live Paybill feed.':'Check your M-Pesa Paybill portal or business SMS inbox. This creates an audit trail.'}</div>
      </div>
      <div class="field">
        <label>Amount actually received on Paybill (KES)</label>
         <input id="conf-amt" type="number" value="${linkedTxn ? Number(linkedTxn.amount||0) : Number(r.actual_amount_received||r.grand_total||0)}" step="0.01" ${linkedTxn?'readonly':''} />
        <div class="helper">Confirm what actually arrived. If it matches the expected total, leave as-is.</div>
      </div>
      <div class="field"><label>Admin notes</label>
        <textarea id="conf-notes" rows="2" placeholder="Note any discrepancies or actions taken..."></textarea>
      </div>
    `,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:' Confirm received', cls:'btn-primary', onClick: async () => {
         const ref = $('conf-ref').value.trim();
         const actualAmt = Number($('conf-amt').value)||r.grand_total;
         const notes = $('conf-notes').value.trim();
         if(!ref) return toast('Select or enter the M-Pesa receipt before confirming.','error');
         const matchingTxn = (state.data.mpesaTransactions||[]).find(t=>cleanMpesaReference(t.trans_id)===cleanMpesaReference(ref));
         if(matchingTxn && matchingTxn.group_id!==r.group_id) return toast('This M-Pesa receipt belongs to a different group.','error');
         const duplicateRecon = (state.data.reconciliations||[]).find(x=>x.id!==r.id && cleanMpesaReference(x.mpesa_reference)===cleanMpesaReference(ref));
         if(duplicateRecon) return toast('This M-Pesa receipt is already linked to another remittance.','error');
        const upd = {
          status: 'confirmed',
          confirmed_by: state.staff.id,
          mpesa_reference: ref||null,
          actual_amount_received: actualAmt,
          admin_notes: notes||null,
          confirmed_at: new Date().toISOString()
        };
        const { error } = await sb.from('rh_reconciliations').update(upd).eq('id',id);
         if(error) return toast(error.message,'error');
         Object.assign(r, upd);
         const markError = matchingTxn
           ? await markMpesaTxnAllocated(matchingTxn.id, 'rh_reconciliations', id)
           : null;
         audit('recon_confirm','rh_reconciliations',id,null,upd);
         closeModal(); render();
         toast(markError
           ? 'Remittance confirmed. Refresh once to update the M-Pesa status.'
           : 'Remittance confirmed and M-Pesa payment reconciled.','success');

function reconActions(ev, id){
  const r = state.data.reconciliations.find(x=>x.id===id);
  const isAdmin = state.staff.role==='admin';
  showActMenu(ev, [...(isAdmin && r.status==='pending'
      ? [{ label:'Confirm received', onClick: ()=>confirmRecon(id) }]
      : []),
    { label:'Delete', danger:true, onClick: ()=>confirmDialog('Delete this remittance record?', async()=>{
      if(!(await ensureFreshToken())) return;
      await sb.from('rh_reconciliations').delete().eq('id',id);
      state.data.reconciliations = state.data.reconciliations.filter(x=>x.id!==id);
      audit('delete','rh_reconciliations',id); render(); toast('Deleted','warn');
    },{ title:'Delete remittance', danger:true }) }
  ]);
}

/* =====================================================================
 * PAGE: M-PESA PAYMENTS
 * Shows raw transactions received from Safaricom Daraja (via the
 * collections-callback edge function) into rh_mpesa_transactions.
 * ===================================================================== */
function pageMpesaPayments(){
  const isAdmin = state.staff.role === 'admin';
  const myGroupIds = isAdmin ? null : new Set(state.data.groups.filter(g=>g.officer_id===state.staff.id).map(g=>g.id));

  // Date filter
  const df = state._mpesaDateFilter || 'today';
  const gc = state._mpesaGroupFilter || '';
  const today = todayISO();
  const tDate = new Date(today);
  const filterDate = (t) => {
    const d = mpesaTxnDateISO(t);
    if(df==='today') return d === today;
    if(df==='week'){ const w = new Date(tDate); w.setDate(w.getDate()-7); return d >= w.toISOString().slice(0,10); }
    if(df==='month'){ const m = new Date(tDate); m.setDate(m.getDate()-30); return d >= m.toISOString().slice(0,10); }
    if(df==='custom') return d >= (state._mpesaCustomStart||'') && d <= (state._mpesaCustomEnd||today);
    return true; // 'all'
  };

  let txns = (state.data.mpesaTransactions || []).slice();
  if(myGroupIds) txns = txns.filter(t => t.group_id && myGroupIds.has(t.group_id));
  if(gc) txns = txns.filter(t => t.group_id === gc);
  txns = txns.filter(filterDate);
  txns = txns.sort((a,b)=> mpesaTxnSortTime(b) - mpesaTxnSortTime(a));

  const tab = state._mpesaTab || 'group';
  const groupRemit = txns.filter(t=>t.transaction_type==='group_remittance');
  const individual = txns.filter(t=>t.transaction_type==='individual_payment');
  const unmatched  = txns.filter(t=>!t.transaction_type || t.transaction_type==='unmatched');
  const unallocCount = individual.filter(t=>t.status!=='allocated').length;

  // Groups for filter dropdown
  const visibleGroups = isAdmin ? state.data.groups : state.data.groups.filter(g=>myGroupIds.has(g.id));

  // Format sender - Safaricom hashes MSISDNs on production (long hex string)
  // but sends FirstName/MiddleName/LastName in plain text.
  // We show the name when the phone is hashed, raw phone when it's plain.
  const formatSender = (t) => {
    const msisdn = t.msisdn || '';
    const isHashed = msisdn.length > 20;
    if(!isHashed && msisdn) return `<span style="font-size:12px">${msisdn}</span>`;
    // Build name from stored fields
    const name = [t.first_name, t.middle_name, t.last_name].filter(Boolean).join(' ').trim();
    if(name) return `<span style="font-size:12px;font-weight:500">${name}</span><div style="font-size:10px;color:var(--text-muted)">Phone encrypted by Safaricom</div>`;
    return `<span style="font-size:11px;color:var(--text-muted)">Unknown sender</span>`;
  };

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>M-Pesa Payments</h1><div class="desc">Live feed of payments received via Daraja on your Paybill <b>${state.settings?.mpesa_shortcode||state.settings?.paybill_number||''}</b>.</div></div>
    </div>

    <div class="card card-pad" style="background:var(--info-50);border-color:var(--info);margin-bottom:16px;font-size:13px;line-height:1.8">
      <b>How this works:</b><br> - <b>Group Remittances</b> - the chairman/treasurer sends the day's total collection to the Paybill using the group's M-Pesa code as the account number. This is the <b>normal, expected</b> channel for all savings and repayments.<br> - <b>Individual / Late Payments</b> - occasionally a member who genuinely could not attend the meeting may send their own contribution directly to the Paybill (same group code, from their own registered phone).<br> - <b>Unmatched</b> - payments where the account number could not be matched to a group. An admin must match these manually.<br> - Privacy:  <b>Sender phone numbers</b> are encrypted by Safaricom on production for privacy - shown as "Verified sender".
    </div>

    <div class="card card-pad" style="background:var(--warning-50,#fffbeb);border-color:var(--warning);margin-bottom:16px;font-size:13px">
      Warning:  <b>Policy note:</b> Members should attend weekly group meetings and pay through the chairman/treasurer.
      Individual M-Pesa payments are an exception for genuine emergencies only.
      Privacy:  No cash ever passes through the loan officer.
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <span style="font-size:12px;color:var(--text-muted)">Filter:</span>

        `<button class="btn btn-sm ${df===k?'btn-primary':'btn-outline'}" onclick="state._mpesaDateFilter='${k}';pageMpesaPayments()">${l}</button>`

      <div style="position:relative;margin-left:8px;min-width:200px">

            const linked = reconciliationForMpesaTransaction(t);
            return `<tr>
              <td style="font-size:12px">${formatMpesaDateTime(t)}</td>
              <td><b>${g?.name||' - '}</b></td>
              <td><code style="font-family:monospace;font-size:11px">${g?.group_code||t.account_reference||' - '}</code></td>
              <td>${formatSender(t)}</td>

          }).join(''):`<tr><td colspan="7"><div class="empty"><h4>No group remittances</h4><p>When the chairman sends the day's total to the Paybill using the group's M-Pesa code, it will appear here.</p></div></td></tr>`}

      Tip:  When logging a remittance under <b>Remittances -> Log remittance</b>, paste the M-Pesa Receipt number into the "M-Pesa reference" field so it auto-links here.
    </p>`:''}

    ${tab==='individual'?`
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Date/Time</th><th>Member</th><th>Group</th><th>Sender</th>
          <th class="num">Amount</th><th>M-Pesa Receipt</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>
          ${individual.length?individual.map(t=>{
            const mem = state.data.members.find(m=>m.id===t.member_id);
            const g = state.data.groups.find(x=>x.id===t.group_id);
            return `<tr>
              <td style="font-size:12px">${formatMpesaDateTime(t)}</td>
              <td><b>${mem?.full_name||' - '}</b></td>

              <td class="num"><b>${KES(t.amount)}</b></td>

              <td>${t.status==='allocated'?' - '

            </tr>`;
          }).join(''):`<tr><td colspan="8"><div class="empty"><h4>No individual payments</h4><p>This list should normally be empty - members pay through the chairman/treasurer at the weekly meeting.</p></div></td></tr>`}
        </tbody>
      </table>
    </div>`:''}

    ${tab==='unmatched'&&isAdmin?`
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Date/Time</th><th>Account Ref (typed)</th><th>Sender</th>
          <th class="num">Amount</th><th>M-Pesa Receipt</th><th></th>
        </tr></thead>
        <tbody>
          ${unmatched.length?unmatched.map(t=>`<tr>
            <td style="font-size:12px">${formatMpesaDateTime(t)}</td>
            <td><code style="font-family:monospace;font-size:12px">${t.account_reference||' - '}</code></td>
            <td>${formatSender(t)}</td>
            <td class="num"><b>${KES(t.amount)}</b></td>
            <td><code style="font-family:monospace;font-size:11px">${t.trans_id||' - '}</code></td>
            <td><button class="btn btn-sm btn-outline" onclick="openManualMatchMpesa('${t.id}')">Match manually</button></td>
          </tr>`).join(''):`<tr><td colspan="6"><div class="empty"><h4>No unmatched payments</h4><p>Every incoming payment matched a group code.</p></div></td></tr>`}
        </tbody>
      </table>
    </div>`:''}
  `;

  // Attach date range listeners
  const dsEl = document.getElementById('mpesa-date-start');
  const deEl = document.getElementById('mpesa-date-end');
  if(dsEl) dsEl.addEventListener('change', e=>{ state._mpesaCustomStart=e.target.value; pageMpesaPayments(); });
  if(deEl) deEl.addEventListener('change', e=>{ state._mpesaCustomEnd=e.target.value; pageMpesaPayments(); });

  // Live group search
  const grpSearch = document.getElementById('mpesa-grp-search');
  const grpDrop = document.getElementById('mpesa-grp-dropdown');
  if(grpSearch && grpDrop){
    const showDrop = (q) => {
      const matches = visibleGroups.filter(g => !q || g.name.toLowerCase().includes(q.toLowerCase()));
      grpDrop.innerHTML = [
        `<div style="padding:8px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--border);color:var(--text-muted)"
          onmousedown="state._mpesaGroupFilter='';pageMpesaPayments()">All Groups</div>`,...matches.map(g=>`<div style="padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)"
          onmousedown="state._mpesaGroupFilter='${g.id}';pageMpesaPayments()">${g.name}
          ${g.group_code?`<span style='font-size:10px;color:var(--text-muted);margin-left:6px'>${g.group_code}</span>`:''}
        </div>`)
      ].join('');
      grpDrop.style.display = matches.length ? 'block' : 'none';
    };
    grpSearch.addEventListener('focus', () => showDrop(grpSearch.value));
    grpSearch.addEventListener('input', () => showDrop(grpSearch.value));
    grpSearch.addEventListener('blur', () => setTimeout(()=>{ grpDrop.style.display='none'; }, 200));
  }
}

/* ----- Allocate an individual M-Pesa payment to Savings or Loan Repayment ----- */
function openAllocateMpesaPayment(txnId){
  const t = state.data.mpesaTransactions.find(x=>x.id===txnId);
  if(!t) return toast('Transaction not found.','error');
  const mem = state.data.members.find(m=>m.id===t.member_id);
  const g   = state.data.groups.find(x=>x.id===t.group_id);
  const myLoans = state.data.loans.filter(l=>l.member_id===t.member_id && l.status==='active');

  const isAdmin = state.staff.role === 'admin';
  modal({
    title:`Allocate M-Pesa Payment - ${mem?.full_name||'Unknown'}`,
    body:`
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:14px;font-size:13px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div class="muted" style="font-size:11px">Member</div><div style="font-weight:600">${mem?.full_name||' - '}</div></div>
          <div><div class="muted" style="font-size:11px">Group</div><div style="font-weight:600">${g?.name||' - '}</div></div>
          <div><div class="muted" style="font-size:11px">Amount paid</div><div style="font-weight:700;color:var(--success)">${KES(t.amount)}</div></div>
          <div><div class="muted" style="font-size:11px">M-Pesa Receipt</div><div style="font-family:monospace;font-size:12px">${t.trans_id||' - '}</div></div>
        </div>
      </div>
      ${!isAdmin ? `
      <div style="background:var(--warning-50,#fffbeb);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:14px;font-size:12px">
        Note:  This will be saved as <b>pending</b> and reviewed by an admin before it counts toward the member's balance - the same as any meeting entry you record.
      </div>` : ''}
      <div class="field">
        <label>Allocate this payment as *</label>
        <select id="mp-alloc-type" onchange="mpAllocTypeChanged()">
          <option value=""> -  Select  - </option>
          <option value="savings">Savings deposit</option>
          ${myLoans.length ? `<option value="repayment">Loan repayment</option>` : ''}
        </select>
      </div>
      <div id="mp-loan-wrap" style="display:none" class="field">
        <label>Select loan</label>
        <select id="mp-loan-id">
          ${myLoans.map(l=>`<option value="${l.id}">${loanLabel(l)} - outstanding ${KES(Math.max(0,Number(l.total_payable)-loanPaid(l.id)))}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="mp-date" value="${t.transaction_time ? new Date(t.transaction_time).toISOString().slice(0,10) : todayISO()}" />
      </div>
    `,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:'Save Allocation', cls:'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const type = $('mp-alloc-type').value;
        if(!type) return toast('Please select where to allocate this payment.','error');
        const date = $('mp-date').value || todayISO();
        const amount = Number(t.amount)||0;

        if(type==='savings'){
          const row = {
            business_id: state.staff.business_id || null,
            member_id: t.member_id, group_id: t.group_id,
            meeting_date: date, amount,
            recorded_by: state.staff.id,
            notes: `M-Pesa ${t.trans_id||''} (individual payment)`,
            status: state.staff.role==='admin' ? 'approved' : 'pending'
          };
          const { data, error } = await sb.from('rh_savings').insert(row).select().single();
          if(error) return toast(error.message,'error');
          state.data.savings.unshift(data);
          audit('mpesa_allocate_savings','rh_savings',data.id,null,{ mpesa_txn: t.id });
          await markMpesaTxnAllocated(t.id, 'rh_savings', data.id);
          closeModal(); render(); toast('Payment allocated to Savings.','success');

        } else if(type==='repayment'){
          const loanId = $('mp-loan-id').value;
          const ln = state.data.loans.find(l=>l.id===loanId);
          if(!ln) return toast('Please select a loan.','error');
          const outstanding = Math.max(0, Number(ln.total_payable)-loanPaid(ln.id));
          const useAmount = Math.min(amount, outstanding);
          const ir = Number(ln.total_payable) ? (Number(ln.total_payable)-Number(ln.loan_value))/Number(ln.total_payable) : 0;
          const interest = +(useAmount*ir).toFixed(2);
          const principal = +(useAmount-interest).toFixed(2);
          const row = {
            business_id: state.staff.business_id || null,
            loan_id: ln.id, member_id: t.member_id, group_id: t.group_id,
            meeting_date: date, amount: useAmount, principal, interest,
            recorded_by: state.staff.id,
            status: state.staff.role==='admin' ? 'approved' : 'pending'
          };
          const { data, error } = await sb.from('rh_repayments').insert(row).select().single();
          if(error) return toast(error.message,'error');
          state.data.repayments.unshift(data);
          audit('mpesa_allocate_repayment','rh_repayments',data.id,null,{ mpesa_txn: t.id });
          if(loanPaid(ln.id) >= Number(ln.total_payable)){
            await sb.from('rh_loans').update({ status:'completed' }).eq('id', ln.id);
            ln.status='completed';
          }
          await markMpesaTxnAllocated(t.id, 'rh_repayments', data.id);
          closeModal(); render();
          toast(useAmount < amount
            ? `Payment allocated. Note: only ${KES(useAmount)} of ${KES(amount)} was applied (loan balance cleared) - remainder may need a separate savings entry.`
            : 'Payment allocated to Loan Repayment.', 'success');
        }
      }}
    ]
  });
}
function mpAllocTypeChanged(){
  const v = $('mp-alloc-type')?.value;
  const wrap = $('mp-loan-wrap');
  if(wrap) wrap.style.display = v==='repayment' ? 'block' : 'none';
}
async function markMpesaTxnAllocated(txnId, table, recordId){
  const { error } = await sb.from('rh_mpesa_transactions').update({
    status: 'allocated', allocated_table: table, allocated_id: recordId,
    allocated_by: state.staff.id, allocated_at: new Date().toISOString()
  }).eq('id', txnId);
  const t = state.data.mpesaTransactions.find(x=>x.id===txnId);
  if(t && !error){ t.status='allocated'; t.allocated_table=table; t.allocated_id=recordId; }
  return error || null;
}

/* ----- Admin: manually match an unmatched M-Pesa transaction to a group/member ----- */
function openManualMatchMpesa(txnId){
  const t = state.data.mpesaTransactions.find(x=>x.id===txnId);
  if(!t) return toast('Transaction not found.','error');
  modal({
    title:'Match payment manually',
    body:`
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;font-size:13px">
        Account ref typed: <code>${t.account_reference||' - '}</code> - Phone: ${t.msisdn||' - '} - Amount: <b>${KES(t.amount)}</b>
      </div>
      <div class="field"><label>Group *</label>
        <select id="mm-group">
          <option value=""> -  Select group  - </option>
          ${state.data.groups.map(g=>`<option value="${g.id}">${g.name} (${g.group_code||'no code'})</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Member (optional - leave blank if this is the chairman's bulk remittance)</label>
        <select id="mm-member">
          <option value=""> -  Bulk group remittance  - </option>
          ${state.data.members.map(m=>`<option value="${m.id}" data-group="${m.group_id}">${m.full_name}</option>`).join('')}
        </select>
      </div>
    `,
    actions:[
      { label:'Cancel', onClick: closeModal },
      { label:'Save match', cls:'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const groupId = $('mm-group').value;
        const memberId = $('mm-member').value || null;
        if(!groupId) return toast('Please select a group.','error');
        const type = memberId ? 'individual_payment' : 'group_remittance';
        const { error } = await sb.from('rh_mpesa_transactions').update({
          group_id: groupId, member_id: memberId, transaction_type: type
        }).eq('id', t.id);
        if(error) return toast(error.message,'error');
        t.group_id = groupId; t.member_id = memberId; t.transaction_type = type;
        audit('mpesa_manual_match','rh_mpesa_transactions',t.id,null,{ groupId, memberId, type });
        closeModal(); render();
        toast('Payment matched. ' + (memberId ? 'It now appears under Individual Payments for allocation.' : 'It now appears under Group Remittances.'), 'success');
      }}
    ]
  });
}


/* =====================================================================
 * PAGE: ACCOUNTING
 * ===================================================================== */
function pageAccounting(){
  const { start, end } = dashDateRange();
  const inRange = date => date >= start && date <= end;
  const filterBtns = [['today','Today'],['yesterday','Yesterday'],['week','This week'],['month','Last month'],['3months','Last 3 months'],['custom','Custom']];

  // === INCOME ===
  // Regular savings only (exclude registration and deposit types)
  const savingsInPeriod = state.data.savings.filter(s => inRange(s.meeting_date||'') && (!s.type || s.type === 'savings'));
  const totalSavingsIn = savingsInPeriod.reduce((a,b)=>a+Number(b.amount||0),0);
  const repayInPeriod = state.data.repayments.filter(r=>inRange(r.meeting_date||''));
  const totalPrincipalIn = repayInPeriod.reduce((a,b)=>a+Number(b.principal||0),0);
  const totalInterestIn = repayInPeriod.reduce((a,b)=>a+Number(b.interest||0),0);
  const totalRepayIn = repayInPeriod.reduce((a,b)=>a+Number(b.amount||0),0);

  // === REGISTRATION FEES (actual installments paid, tracked separately) ===
  const regInstallmentsInPeriod = state.data.savings.filter(s => inRange(s.meeting_date||'') && s.type === 'registration');
  const totalRegFees = regInstallmentsInPeriod.reduce((a,b)=>a+Number(b.amount||0),0);
  const uniqueRegMembers = new Set(regInstallmentsInPeriod.map(s=>s.member_id));

  // === LOANS ISSUED ===
  const loansIssued = state.data.loans.filter(l=>inRange(l.start_date||''));
  const totalLoansOut = loansIssued.reduce((a,b)=>a+Number(b.loan_value||0),0);
  const totalExpectedReturn = loansIssued.reduce((a,b)=>a+Number(b.total_payable||0),0);

  // === OPERATIONAL EXPENSES ===
  const expensesInPeriod = (state.data.expenses||[]).filter(e=>inRange(e.date||''));
  const totalExpensesOut = expensesInPeriod.reduce((a,b)=>a+Number(b.amount||0),0);

  // === BALANCE SHEET SNAPSHOT ===
  const activeLoans = state.data.loans.filter(l=>l.status==='active');
  const totalOutstanding = activeLoans.reduce((a,l)=>a+(Number(l.total_payable||0)-loanPaid(l.id)),0);
  const totalSavingsBalance = state.data.members.reduce((a,m)=>a+memberSavings(m.id),0);

  // === RECONCILIATION STATUS ===
  const reconInPeriod = state.data.reconciliations.filter(r=>inRange(r.meeting_date||''));
  const reconConfirmed = reconInPeriod.filter(r=>r.status==='confirmed').reduce((a,b)=>a+Number(b.grand_total||0),0);
  const reconPending = reconInPeriod.filter(r=>r.status==='pending').reduce((a,b)=>a+Number(b.grand_total||0),0);

  // By-group savings breakdown
  const groupBreakdown = state.data.groups.map(g=>{
    const sv = savingsInPeriod.filter(s=>s.group_id===g.id).reduce((a,b)=>a+Number(b.amount||0),0);
    const rp = repayInPeriod.filter(r=>r.group_id===g.id).reduce((a,b)=>a+Number(b.amount||0),0);
    return { name:g.name, savings:sv, repayments:rp, total:sv+rp };
  }).filter(g=>g.total>0).sort((a,b)=>b.total-a.total);

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Accounting</h1><div class="desc">Cash-flow view across savings, cash loans, repayments, expenses and reconciliations.</div></div>
      <div class="actions"><button class="btn btn-outline" onclick="exportAccountingReport()">Export to Excel</button></div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
      ${filterBtns.map(([k,l])=>`<button class="btn btn-sm ${_dashFilter===k?'btn-primary':'btn-outline'}" onclick="_dashFilter='${k}';pageAccounting()">${l}</button>`).join('')}
      ${_dashFilter==='custom'?`<input type="date" id="acc-custom-start" value="${_dashCustomStart}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />
      <span class="muted" style="font-size:12px">to</span>
      <input type="date" id="acc-custom-end" value="${_dashCustomEnd}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />`:''}
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px">
      <div class="kpi k-success"><div class="l">Savings collected</div><div class="v">${KES(totalSavingsIn)}</div><div class="d">${savingsInPeriod.length} entries</div></div>
      <div class="kpi k-primary"><div class="l">Loan repayments</div><div class="v">${KES(totalRepayIn)}</div><div class="d">Interest ${KES(totalInterestIn)}</div></div>
      <div class="kpi k-success"><div class="l">Registration fees</div><div class="v">${KES(totalRegFees)}</div><div class="d">${uniqueRegMembers.size} member(s) - ${regInstallmentsInPeriod.length} installment(s)</div></div>
      <div class="kpi k-warn"><div class="l">Principal disbursed</div><div class="v">${KES(totalLoansOut)}</div><div class="d">${loansIssued.length} loans</div></div>
      <div class="kpi k-primary"><div class="l">Expected return</div><div class="v">${KES(totalExpectedReturn)}</div><div class="d">Interest: ${KES(totalExpectedReturn-totalLoansOut)}</div></div>
      <div class="kpi k-danger"><div class="l">Operational Expenses</div><div class="v">${KES(totalExpensesOut)}</div><div class="d">${expensesInPeriod.length} entr${expensesInPeriod.length!==1?'ies':'y'}</div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px">
      <div class="card card-pad">
        <h3 style="margin:0 0 14px">Period Income Statement</h3>

let _expDateFilter = 'month';
let _expCustomStart = '', _expCustomEnd = '';

const EXPENSE_CATEGORIES = ['Transport','Office Supplies','Utilities','Salary','Airtime/Data','Other'];

function expDateRange(){
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const today = iso(now);
  if(_expDateFilter==='today') return { start: today, end: today };
  if(_expDateFilter==='yesterday'){
    const y = new Date(now); y.setDate(y.getDate()-1); const yd = iso(y);
    return { start: yd, end: yd };
  }
  if(_expDateFilter==='week'){
    const d = new Date(now); d.setDate(d.getDate()-6);
    return { start: iso(d), end: today };
  }
  if(_expDateFilter==='month'){
    const d = new Date(now); d.setDate(1);
    return { start: iso(d), end: today };
  }
  if(_expDateFilter==='custom'){
    return { start: _expCustomStart||today, end: _expCustomEnd||today };
  }
  return { start: today, end: today };
}

function pageExpenses(){
  const isAdmin = state.staff.role === 'admin';
  const { start, end } = expDateRange();

  const inRangeFallback = (dateStr, createdAt) => {
    const d = (dateStr||'').slice(0,10);
    if(d >= start && d <= end) return true;
    if(createdAt){ const cd = new Date(createdAt).toISOString().slice(0,10); return cd >= start && cd <= end; }
    return false;
  };

  const filtered = (state.data.expenses||[]).filter(e => inRangeFallback(e.date||'', e.created_at));
  const totalAmt = filtered.reduce((a,b)=>a+Number(b.amount||0),0);

  const dateFilterBtns = [
    ['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['custom','Custom Range']
  ];

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Expenses</h1><div class="desc">${filtered.length} entries - Total ${KES(totalAmt)}</div></div>
      <div class="actions">
        ${isAdmin ? `<button class="btn btn-primary" onclick="openExpenseForm()">+ Record Expense</button>` : ''}
      </div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      ${dateFilterBtns.map(([k,l])=>`<button class="btn btn-sm ${_expDateFilter===k?'btn-primary':'btn-outline'}" onclick="_expDateFilter='${k}';pageExpenses()">${l}</button>`).join('')}
      ${_expDateFilter==='custom'?`
        <input type="date" id="exp-custom-start" value="${_expCustomStart}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />
        <span class="muted" style="font-size:12px">to</span>
        <input type="date" id="exp-custom-end" value="${_expCustomEnd}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />
      `:''}
    </div>

    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th>Recorded By</th><th></th>
        </tr></thead>
        <tbody>
          ${filtered.length ? filtered.map(e => {
            const rec = state.data.staff.find(x=>x.id===e.recorded_by);
            const catColors = {
              Transport:'b-blue', 'Office Supplies':'b-grey', Utilities:'b-yellow',
              Salary:'b-info', 'Airtime/Data':'b-green', Other:'b-grey'

            return `<tr>
              <td>${fmtDate(e.date)}</td>
              <td><span class="badge ${catColors[e.category]||'b-grey'}">${e.category||' - '}</span></td>
              <td style="max-width:260px;white-space:normal;font-size:13px">${e.description||' - '}</td>

              <td><button class="act-btn" onclick="expenseActions(event,'${e.id}')"> - - - </button></td>
            </tr>`;

function expenseActions(ev, id){
  const isAdmin = state.staff.role === 'admin';
  const items = [
    { label: 'Edit  Edit Expense', onClick: () => openExpenseForm(id) },
  ];
  if(isAdmin){

        state.data.expenses = state.data.expenses.filter(x => x.id !== id);
        audit('delete_expense', 'rh_expenses', id);
        render();
        toast('Expense deleted.', 'warn');
      },

function openExpenseForm(id=null){
  const isAdmin = state.staff.role === 'admin';
  if(!isAdmin){ toast('Only administrators can record or edit expenses.', 'error'); return; }

  const existing = id ? (state.data.expenses||[]).find(x => x.id === id) : null;
  const title = existing ? 'Edit Expense' : 'Record Expense';

  modal({
    title,
    body: `
      <div class="grid-2">
        <div class="field">
          <label>Date *</label>
          <input type="date" id="ef-date" value="${existing?.date || todayISO()}" required />
        </div>
        <div class="field">
          <label>Category *</label>
          <select id="ef-category" required>
            ${EXPENSE_CATEGORIES.map(c=>`<option value="${c}" ${existing?.category===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Amount (KES) *</label>
        <input type="number" id="ef-amount" min="0.01" step="0.01" value="${existing?.amount||''}" placeholder="0.00" required />
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="ef-description" rows="3" placeholder="Brief description of what this expense was for..." style="resize:vertical">${existing?.description||''}</textarea>
      </div>
    `,
    actions: [
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: existing ? 'Save Changes' : 'Record Expense', cls: 'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const date = document.getElementById('ef-date')?.value;
        const category = document.getElementById('ef-category')?.value;
        const amount = Number(document.getElementById('ef-amount')?.value);
        const description = document.getElementById('ef-description')?.value.trim();

        if(!date) return toast('Date is required.', 'error');
        if(!category) return toast('Category is required.', 'error');
        if(!amount || amount <= 0) return toast('Enter a valid amount greater than zero.', 'error');

        const row = {
          business_id: state.staff.business_id || null,
          date,
          category,
          amount,
          description: description || null,
          recorded_by: state.staff.id
        };

        if(existing){
          const { error } = await sb.from('rh_expenses').update({ date, category, amount, description: description||null }).eq('id', existing.id);
          if(error) return toast(error.message, 'error');
          Object.assign(existing, { date, category, amount, description: description||null });
          audit('update_expense', 'rh_expenses', existing.id, null, { date, category, amount });
          closeModal(); render(); toast('Expense updated.', 'success');
        } else {
          const { data, error } = await sb.from('rh_expenses').insert(row).select().single();
          if(error) return toast(error.message, 'error');
          state.data.expenses.unshift(data);
          audit('create_expense', 'rh_expenses', data.id, null, row);
          closeModal(); render(); toast('Expense recorded successfully.', 'success');
        }
      }}
    ]
  });
}

function exportSavingsFiltered(){
  const isAdmin = state.staff.role === 'admin';
