<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b4f9c" />
<title>Rhostine Limited Groups</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Rhostine Limited Groups","short_name":"Rhostine","start_url":".","scope":".","display":"standalone","background_color":"%23f5f7fa","theme_color":"%230b4f9c"}' />
<link rel="icon" href="assets/rhostine-logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#f9fafc; --border:#e3e7ee;
  --text:#0d1b2a; --text-muted:#5a6478; --text-subtle:#8a93a6;
  --primary:#0b4f9c; --primary-700:#083b76; --primary-50:#eaf2fb;
  --accent:#e46c16; --accent-50:#fff1e7;
  --success:#137a3f; --success-50:#e6f5ec;
  --warning:#9a6700; --warning-50:#fff5db;
  --danger:#a4262c; --danger-50:#fbeaea;
  --info:#1769aa; --info-50:#e8f3fb;
  --radius:8px; --radius-sm:6px; --radius-lg:8px;
  --shadow-sm:0 1px 2px rgba(13,27,42,.06), 0 1px 1px rgba(13,27,42,.04);
  --shadow-md:0 4px 12px rgba(13,27,42,.08);
  --shadow-lg:0 14px 40px rgba(13,27,42,.18);
  --sidebar-w:248px;
  --header-h:56px;
}
body.dark{
  --bg:#10151d; --surface:#18212c; --surface-2:#141c26; --border:#2b3b4d;
  --text:#e6ecf5; --text-muted:#9aa7bd; --text-subtle:#6c7a92;
  --primary:#1769bd; --primary-700:#2f7dcc; --primary-50:#17314d;
  --accent:#f1873a; --accent-50:#3c281b;
  --success-50:#0f2a1c; --warning-50:#2a2208; --danger-50:#2a1212; --info-50:#0f2333;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-50)}
input[disabled],select[disabled]{background:var(--surface-2);color:var(--text-muted)}
label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;letter-spacing:.01em}
.field{margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid transparent;background:var(--surface);color:var(--text);font-weight:600;font-size:13px;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-700)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{filter:brightness(1.08)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text)}
.btn-outline:hover{background:var(--surface-2);border-color:var(--text-muted)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-ghost{background:transparent;border:none;color:var(--text-muted);padding:6px 10px}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-block{width:100%}

/* Layout */
#app{min-height:100vh}
.auth-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--primary) 0%,#091a30 100%)}
.auth-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:36px 32px;width:100%;max-width:420px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.auth-brand .mark{width:36px;height:36px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:.5px}
.auth-brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.auth-sub{color:var(--text-muted);font-size:13px;margin-bottom:22px}
.auth-sep{margin:18px 0;border-top:1px solid var(--border);position:relative;text-align:center}
.auth-sep span{position:relative;top:-9px;background:var(--surface);padding:0 10px;font-size:11px;color:var(--text-subtle);text-transform:uppercase;letter-spacing:.08em}
.auth-error{background:var(--danger-50);color:var(--danger);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-bottom:14px}
.auth-info{background:var(--info-50);color:var(--info);border:1px solid var(--info);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;margin-bottom:14px}

.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--primary);color:#cbd6e8;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:40;transition:transform .25s ease}
.sidebar .brand{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar .brand .mark{width:30px;height:30px;border-radius:7px;background:#fff;color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:12px}
.brand-logo{width:48px;height:42px;background:#fff url('assets/rhostine-logo.png') left 46%/145% auto no-repeat;border-radius:6px;flex-shrink:0}
.sidebar .brand .brand-logo{width:36px;height:36px}
.sidebar .brand .title{color:#fff;font-weight:700;font-size:14px;letter-spacing:-.01em}
.sidebar .brand .sub{color:#7e92b4;font-size:11px;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:14px 10px}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6e83a7;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:#cbd6e8;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.active{background:rgba(255,255,255,.10);color:#fff}
.nav a .icn{width:16px;height:16px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#9bb0d3}
.nav a.active .icn{color:#fff}
.sidebar-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#8a9dbe}

.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:30}
.topbar .menu-btn{display:none;background:none;border:none;padding:6px;color:var(--text)}
.topbar h2{margin:0;font-size:15px;font-weight:600;color:var(--text);flex:1;letter-spacing:-.01em}
.topbar .user{display:flex;align-items:center;gap:10px}
.topbar .user .av{width:30px;height:30px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px}
.topbar .user .name{font-size:13px;font-weight:600;line-height:1.2}
.topbar .user .role{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}

.content{flex:1;padding:22px 26px 80px;max-width:100%;overflow-x:hidden}
@media(max-width:1024px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .topbar .menu-btn{display:inline-flex}
  .content{padding:16px 14px 96px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
.scrim.show{display:block}

/* Page chrome */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-.015em}
.page-head .desc{color:var(--text-muted);font-size:13px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}

.card{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)}
.card>div[style*="overflow-x:auto"]{max-width:100%}
.card-pad{padding:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.005em}
.card-head .sub{font-size:12px;color:var(--text-muted)}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:var(--accent)}
.kpi.k-success::before{background:var(--success)}
.kpi.k-warn::before{background:var(--warning)}
.kpi.k-danger::before{background:var(--danger)}
.kpi.k-primary::before{background:var(--primary)}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--text-muted);margin-top:3px}
.collection-panel{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--success);border-radius:var(--radius-lg);padding:18px;margin-bottom:20px}
.collection-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}
.collection-head h3{margin:0;font-size:16px}
.collection-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.collection-metric{background:var(--surface);padding:14px;min-width:0}
.collection-metric .label{font-size:11px;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.collection-metric .amount{font-size:20px;font-weight:700;margin-top:5px;white-space:nowrap}
.collection-metric .detail{font-size:11px;color:var(--text-muted);margin-top:3px}
.collection-progress{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:14px}
.collection-progress>div{height:100%;background:var(--success);transition:width .25s}
@media(max-width:768px){.collection-metrics{grid-template-columns:1fr 1fr}.collection-metric .amount{font-size:17px}.collection-head{align-items:center}}

/* Tables */
.table-wrap{width:100%;max-width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl thead th{text-align:left;padding:11px 14px;background:var(--surface-2);color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.sticky-name{position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:1px 0 0 var(--border)}
thead .sticky-name{background:var(--surface-2);z-index:3}
tr[style*="warning-50"] .sticky-name{background:var(--warning-50)}
tr[style*="danger-50"] .sticky-name{background:var(--danger-50)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.01em;border:1px solid transparent}
.b-green{background:var(--success-50);color:var(--success);border-color:var(--success)}
.b-red{background:var(--danger-50);color:var(--danger);border-color:var(--danger)}
.b-yellow{background:var(--warning-50);color:var(--warning);border-color:var(--warning)}
.b-blue{background:var(--accent-50);color:var(--accent);border-color:var(--accent)}
.b-grey{background:var(--surface-2);color:var(--text-muted);border-color:var(--border)}
.b-info{background:var(--info-50);color:var(--info);border-color:var(--info)}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(13,27,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:50;overflow-y:auto}
.modal-back.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column}
.modal.lg{max-width:780px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x-btn{background:none;border:none;color:var(--text-muted);font-size:20px;line-height:1;padding:4px;cursor:pointer}
.x-btn:hover{color:var(--text)}

/* Stepper */
.stepper{display:flex;justify-content:space-between;margin-bottom:22px;gap:8px}
.step{flex:1;text-align:center;padding:9px 6px;border-radius:var(--radius-sm);background:var(--surface-2);font-size:12px;color:var(--text-muted);font-weight:600;border:1px solid var(--border);position:relative}
.step.done{background:var(--success-50);color:var(--success);border-color:var(--success)}
.step.current{background:var(--primary);color:#fff;border-color:var(--primary)}
.step .n{display:inline-block;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.2);font-size:10px;line-height:18px;margin-right:6px;font-weight:700}
.step.current .n{background:rgba(255,255,255,.25)}
@media(max-width:600px){.step .lbl{display:none}.step{padding:8px 4px}.step .n{margin-right:0}}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:200px}
.search-box{position:relative}
.search-box input{padding-left:34px}
.search-box .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}

/* Action menu (fixed positioning to avoid clipping) */
.act-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 9px;color:var(--text-muted);cursor:pointer;font-size:13px;font-weight:600}
.act-btn:hover{color:var(--text);border-color:var(--text-muted)}
.act-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);z-index:100;min-width:180px;padding:5px;display:none}
.act-menu.show{display:block}
.act-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 11px;background:none;border:none;border-radius:var(--radius-sm);color:var(--text);font-size:13px;cursor:pointer}
.act-menu button:hover{background:var(--surface-2)}
.act-menu button.danger{color:var(--danger)}
.act-menu .sep{height:1px;background:var(--border);margin:4px 0}

/* Empty / loading */
.empty{padding:50px 20px;text-align:center;color:var(--text-muted)}
.empty h4{margin:0 0 6px;color:var(--text);font-weight:600}
.empty p{margin:0;font-size:13px;max-width:380px;margin:0 auto}

.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast-stack{position:fixed;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:340px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);padding:10px 14px;font-size:13px;animation:slideIn .2s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast .t{font-weight:600;margin-bottom:2px}
.toast .m{color:var(--text-muted);font-size:12px}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* Bottom nav (mobile) */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:25;padding:5px 0 max(5px,env(safe-area-inset-bottom));justify-content:space-around}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;color:var(--text-muted);font-size:10px;font-weight:600;cursor:pointer;border-radius:var(--radius-sm);min-width:54px}
.bottom-nav a.active{color:var(--accent)}
@media(max-width:768px){.bottom-nav{display:flex}.content{padding-bottom:84px}}

/* Status banner */
.status-banner{position:fixed;top:0;left:0;right:0;background:var(--warning);color:#fff;text-align:center;padding:6px;font-size:12px;font-weight:600;z-index:300;display:none}
.status-banner.show{display:block}
.status-banner.online{background:var(--success)}

/* Member meeting card */
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:10px}
.mc .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mc .av{width:36px;height:36px;border-radius:50%;background:var(--primary-50);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.mc .nm{font-weight:600;font-size:14px}
.mc .meta{font-size:11px;color:var(--text-muted);margin-top:1px}
.mc .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc .row.three{grid-template-columns:1fr 1fr 1fr}
@media(max-width:480px){.mc .row.three{grid-template-columns:1fr 1fr}}
.mc .ro{background:var(--surface-2);padding:7px 10px;border-radius:var(--radius-sm);font-size:11px;color:var(--text-muted)}
.mc .ro b{display:block;font-size:13px;color:var(--text);font-weight:700;margin-top:1px}
.mc .absent-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--text-muted)}

/* Misc */
.kbd{display:inline-block;padding:1px 6px;font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;color:var(--text-muted);font-family:'SF Mono',Menlo,Consolas,monospace}
.divider{height:1px;background:var(--border);margin:18px 0}
.helper{font-size:11px;color:var(--text-muted);margin-top:4px}
.danger-text{color:var(--danger)}
.success-text{color:var(--success)}
.muted{color:var(--text-muted)}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;gap:2px;overflow-x:auto}
.tabs button{background:none;border:none;padding:10px 14px;color:var(--text-muted);font-weight:600;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.checkbox-row{display:flex;align-items:center;gap:8px}
.checkbox-row input{width:auto}
.summary-table{width:100%;font-size:13px}
.summary-table td{padding:6px 0}
.summary-table td:first-child{color:var(--text-muted);width:45%}
.summary-table td:last-child{font-weight:600;text-align:right}
.summary-table h5{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-subtle)}
</style>
</head>
<body>

<div id="status-banner" class="status-banner"></div>
<div id="toast-stack" class="toast-stack"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="actmenu-root"></div>

<script>
/* =====================================================================
 * PRIME BRAIDOX ENTERPRISE
 * Single-file production application.
 * ===================================================================== */

/* =====================================================================
 * Warning:   SECURITY NOTICE: ROW LEVEL SECURITY (RLS) - MANDATORY SETUP
 * =====================================================================
 * This frontend relies on Supabase Auth sessions to identify which

/* ----- Crypto / hash for offline auth ----- */
async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ----- Offline write queue ----- */
async function queuedInsert(table, row){
  if(navigator.onLine){
    const { error } = await sb.from(table).insert(row);
    if(!error) return { ok:true };
    // fall through to queue on network failures
  }
  const q = lsGet('queue', []);
  q.push({ table, row, t: Date.now() });
  lsSet('queue', q);
  return { ok:true, queued:true };
}
async function flushQueue(){
  const q = lsGet('queue', []);
  if(!q.length) return;
  const remaining = [];
  for(const item of q){
    const { error } = await sb.from(item.table).insert(item.row);
    if(error) remaining.push(item);
  }
  lsSet('queue', remaining);
  if(q.length && !remaining.length) toast('Queued changes synchronised.', 'success');
}

/* Confirmed Rhostine cash-loan policy. All screens and new loans use these formulas. */
const RHOSTINE_TERM_OPTIONS = {
  6:  { months:6,  weeks:25, interestRate:18 },
  9:  { months:9,  weeks:36, interestRate:20 },
  12: { months:12, weeks:50, interestRate:24 }
};
const RHOSTINE_PRINCIPALS = Array.from({length:20}, (_,i)=>(i+1)*5000);
function requiredSavingsFor(principal){
  const fixed = {5000:800,10000:1600,15000:2550,20000:3500,25000:5000,30000:6600,35000:9000,40000:10000,45000:11250,50000:12500,55000:14000,60000:15000,65000:16250};
  if(principal >= 70000) return principal * .33;
  return fixed[principal] || principal * .25;
}
function buildLoanProduct(principal, months){
  const term = RHOSTINE_TERM_OPTIONS[months];
  const cycle = principal <= 30000 ? 1 : 2;
  const interest = principal * term.interestRate / 100;
  const totalPayable = principal + interest;
  const insuranceFee = totalPayable * .035;
  const applicationFee = principal <= 35000 ? 500 : 0;
  const processingFee = principal >= 40000 ? principal * .015 : 0;
  const upfrontFees = insuranceFee + applicationFee + processingFee;
  return {
    id:`${principal}-${months}`, cycle, principal, months, weeks:term.weeks,
    interestRate:term.interestRate, interest, totalPayable,
    weekly:totalPayable/term.weeks, savings:requiredSavingsFor(principal),
    insuranceFee, applicationFee, processingFee, insurance:upfrontFees,
    netDisbursement:principal-upfrontFees, source:'confirmed'
  };
}
const RHOSTINE_LOAN_PRODUCTS = RHOSTINE_PRINCIPALS.flatMap(principal => {
  if(principal <= 30000) return [buildLoanProduct(principal, 6)];
  if(principal === 35000) return [buildLoanProduct(principal, 9)];
  return [6,9,12].map(months=>buildLoanProduct(principal, months));
});
function loanProduct(id){
  return RHOSTINE_LOAN_PRODUCTS.find(p=>p.id===String(id));
}
function loanLabel(loan){
  return loan?.product_name || loan?.asset_name || `Cycle ${loan?.loan_cycle || 1} Cash Loan`;
}

/* ----- M-Pesa group code generator -----
 * Generates a short, unique alphanumeric code (e.g. "GRP-7F3K") used as the
 * M-Pesa Paybill ACCOUNT NUMBER for a group. The chairman/treasurer sends the
 * day's total collection to the business Paybill using this code as the
 * account reference, so incoming payments can be matched back to the group. */
function generateGroupCode(){
  // Generates a random 4-digit number (1000-9999) as the M-Pesa account code.
  // Easy for members to type, no symbols, no ambiguous characters.
  let code, attempts = 0;
  do {
    code = String(Math.floor(1000 + Math.random() * 9000));
    attempts++;
  } while(state.data.groups.some(g => g.group_code === code) && attempts < 100);
  return code;
}

  let s = String(p).replace(/\D/g,'');
  if(s.startsWith('254')) s = '0'+s.slice(3);
  if(s.startsWith('7') || s.startsWith('1')) s = '0'+s;
  return s.slice(0,10);
};

async function signIn(email, password){
  email = email.trim().toLowerCase();
  if(!navigator.onLine){
    const cache = lsGet('auth_cache', {});
    const h = await sha256(password);
    const rec = cache[email];
    if(rec && rec.h === h){
      state.session = { user: { id: rec.auth_user_id, email } };
      state.staff = rec.staff;
      state.perms = rec.perms;
      await afterLogin(true);
      return { ok:true, offline:true };
    }
    return { ok:false, error:'No internet connection and no cached credentials for this account.' };
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error) return { ok:false, error: error.message };
  state.session = data.session;
  let ok = await loadStaff();
  if(!ok){
    const meta = data.session?.user?.user_metadata || {};
    const pendingDetails = meta.business_name && meta.full_name ? { key:meta.registration_key || BUSINESS_REGISTRATION_KEY } : {};
    const provision = await provisionBusinessAdmin(data.session, pendingDetails);
    if(provision.ok) ok = await loadStaff();
  }
  if(!ok){
    await sb.auth.signOut();
    state.session = null;
    return { ok:false, error:'Your authentication account exists but is not provisioned in the staff registry. Please contact your administrator.' };
  }
  // Cache for offline use
  const cache = lsGet('auth_cache', {});
  cache[email] = {
    h: await sha256(password),
    auth_user_id: data.session.user.id,
    staff: state.staff, perms: state.perms
  };
  lsSet('auth_cache', cache);
  await afterLogin(false);
  return { ok:true };
}

async function loadStaff(){
  const uid = state.session.user.id;
  const { data, error } = await sb.from('rh_staff').select('*').eq('auth_user_id', uid).maybeSingle();
  if(error || !data) return false;
  if(data.status !== 'active') return false;
  state.staff = data;
  if(data.business_id){ BIZ_ID = 'biz_' + data.business_id; }
  const { data: perms } = await sb.from('rh_permissions').select('*').eq('staff_id', data.id).maybeSingle();
  state.perms = perms || {};
  return true;
}

/* =====================================================================
 * BUSINESS REGISTRATION (signup with master key)
 * ===================================================================== */
async function registerBusiness({ businessName, adminName, email, password, key }){
  if(key !== BUSINESS_REGISTRATION_KEY){
    return { ok:false, error:'Invalid business registration key. Contact Rhostine Limited Groups to obtain a valid key.' };
  }
  if(!navigator.onLine) return { ok:false, error:'An internet connection is required to register a new business.' };
  email = email.trim().toLowerCase();

  let session = null;

  // A previous login must never supply the identity for a new registration.
  await sb.auth.signOut({ scope:'local' });

  // 1. Create the authentication user. If a previous attempt already created
  //    the auth account, sign in and complete the missing staff provisioning.
  const { data: authData, error: authErr } = await sb.auth.signUp({
    email, password,
    options: {
      emailRedirectTo: authRedirectUrl(),
      data: { full_name: adminName, business_name: businessName, registration_key:key, pending_business_registration:true }
    }
  });

  if(authErr){
    const msg = authErr.message || '';
    if(/already|registered|exists/i.test(msg)){
      const { data: loginData, error: loginErr } = await sb.auth.signInWithPassword({ email, password });
      if(loginErr){
        return { ok:false, error:'This email already has an authentication account. If you have already received the confirmation email, click Confirm email first, then return here and press Register business again with the same email, password and registration key.' };
      }
      session = loginData.session || null;
    } else {
      return { ok:false, error: msg };
    }
  } else {
    session = authData.session || null;
    // Existing emails may return a placeholder user without an error. Never
    // use that ID for provisioning; authenticate the actual account instead.
    if(!session && authData.user && Array.isArray(authData.user.identities) && authData.user.identities.length===0){
      const { data: loginData, error: loginErr } = await sb.auth.signInWithPassword({ email, password });
      if(loginErr){
        const awaitingConfirmation = /confirm|verified/i.test(loginErr.message||'');
        return { ok:false, error:awaitingConfirmation
          ? 'This account was created but its email is not confirmed yet. Open the Supabase confirmation email and confirm the address; the confirmation link will return you to the sign-in page.'
          : 'This email already has an account. Use its existing password or choose Forgot password.' };
      }
      session = loginData.session || null;
    }
  }

  if(!authData?.user && !session) return { ok:false, error:'Authentication account could not be created.' };

  // Email-confirmation projects do not issue a session at signup. Provisioning
  // must wait because the database only accepts the authenticated user's ID.
  if(!session) return { ok:true, requiresEmailConfirmation:true };

  const provision = await provisionBusinessAdmin(session, {businessName,adminName,email,key});
  if(!provision.ok) return { ok:false, error:'Business provisioning failed: ' + (provision.error || 'Registration details are incomplete.') };

  if(session){
    state.session = session;
    const ok = await loadStaff();
    if(ok){ await afterLogin(false); return { ok:true, signedIn:true }; }
  }

  return { ok:true, requiresEmailConfirmation: !session };
}

async function smartLoadAll(){
  // Refresh the token before bulk fetching to avoid 401s on expired sessions
  if(navigator.onLine){
    const { data: sessionData, error: sessionErr } = await sb.auth.getSession();
    if(sessionErr || !sessionData.session){
      toast('Session expired. Please sign in again.', 'error');
      await sb.auth.signOut();
      state.session = null; state.staff = null; state.perms = null;
      render(); return;
    }
    const exp = sessionData.session.expires_at;
    if(exp && (exp - Math.floor(Date.now()/1000)) < 600){
      const { data: refreshed, error: refreshErr } = await sb.auth.refreshSession();
      if(!refreshErr && refreshed.session) state.session = refreshed.session;
    }
  }
  state.loading = true; render();
  const tables = ['rh_groups','rh_members','rh_guarantors','rh_staff','rh_loans','rh_savings','rh_repayments','rh_meetings','rh_reconciliations','rh_expenses','rh_mpesa_transactions'];
  const map = { rh_groups:'groups', rh_members:'members', rh_guarantors:'guarantors', rh_staff:'staff', rh_loans:'loans', rh_savings:'savings', rh_repayments:'repayments', rh_meetings:'meetings', rh_reconciliations:'reconciliations', rh_expenses:'expenses', rh_mpesa_transactions:'mpesaTransactions' };
  const results = await Promise.all(tables.map(t => {
    let query = sb.from(t).select('*').limit(5000);
    if (state.staff && state.staff.business_id) {
      query = query.eq('business_id', state.staff.business_id);
    }
    return query;
  }));
  let jwtBroken = false;
  results.forEach((r,i) => {
    if(!r.error){
      state.data[map[tables[i]]] = r.data || [];
      lsSet(map[tables[i]], r.data || []);
    } else {
      if(!jwtBroken && r.error.message && /jwt|unauthorized|401/i.test(r.error.message)){
        jwtBroken = true;
        toast('Authentication error loading data. Please sign in again.', 'error');
        sb.auth.signOut().then(()=>{ state.session=null; state.staff=null; state.perms=null; render(); });
      }
      state.data[map[tables[i]]] = lsGet(map[tables[i]], []);
    }
  });
  if(!jwtBroken){
    state.loading = false;
  }
}

/* ----- Realtime ----- */
let rtChan = null;
function setupRealtime(){
  if(rtChan) sb.removeChannel(rtChan);
  rtChan = sb.channel('rh_changes')
    .on('postgres_changes', { event:'*', schema:'public' }, payload => {
      // Fix 2: Live-sync settings changes so all connected users see new rates immediately
      if(payload.table === 'rh_settings'){
        state.settings = payload.new;
        lsSet('settings', state.settings);
        render();
        return;
      }
      const tbl = payload.table;
      const map = { rh_groups:'groups', rh_members:'members', rh_guarantors:'guarantors', rh_loans:'loans', rh_savings:'savings', rh_repayments:'repayments', rh_meetings:'meetings', rh_staff:'staff', rh_reconciliations:'reconciliations', rh_expenses:'expenses', rh_mpesa_transactions:'mpesaTransactions' };
      const key = map[tbl]; if(!key) return;
      const arr = state.data[key];
      if(payload.eventType === 'INSERT'){ if(!arr.find(x=>x.id===payload.new.id)) arr.unshift(payload.new); }
      else if(payload.eventType === 'UPDATE'){ const i = arr.findIndex(x=>x.id===payload.new.id); if(i>=0) arr[i] = payload.new; }
      else if(payload.eventType === 'DELETE'){ const i = arr.findIndex(x=>x.id===payload.old.id); if(i>=0) arr.splice(i,1); }
      lsSet(key, arr);
      if(['dashboard','members','groups','meeting','loans','mpesaPayments'].includes(state.view)) render();
    })
    .subscribe();
}

function memberSavings(memberId){

    .filter(s => s.member_id === memberId && s.status !== 'pending' && (!s.type || s.type === 'savings'))

}
function memberRegPaid(memberId){

    .filter(s => s.member_id === memberId && s.status !== 'rejected' && s.type === 'registration')
    .reduce((a,b) => a + Number(b.amount||0), 0);
}
function memberLoan(memberId){

}
function loanRepaymentPaid(loanId){
  return state.data.repayments.filter(r=>r.loan_id===loanId && r.status==='approved').reduce((a,b)=>a + Number(b.amount||0), 0);
}
function loanPaid(loanId){
  return loanRepaymentPaid(loanId);
}
function localDateFromISO(dateStr){
  const s = (dateStr || '').slice(0,10);
  const [y,m,d] = s.split('-').map(Number);
  if(!y || !m || !d) return null;
  return new Date(y, m - 1, d);
}
function localDateISO(date){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,'0'), d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function loanWeeksElapsed(loan, asOf=todayISO()){
  const start = localDateFromISO(loan?.start_date);
  const end = localDateFromISO(asOf);
  if(!start || !end) return 0;
  const msPerWeek = 7 * 24 * 3600 * 1000;
  return Math.max(0, Math.floor((end - start) / msPerWeek));
}
function loanExpectedPaidAsOf(loan, asOf=todayISO()){
  const weekly = Number(loan?.weekly_installment) || 0;
  const total = Number(loan?.total_payable) || 0;
  return Math.min(loanWeeksElapsed(loan, asOf) * weekly, total);
}
function loanArrearsAsOf(loan, asOf=todayISO()){
  return Math.max(0, loanExpectedPaidAsOf(loan, asOf) - loanPaid(loan.id));
}
function loanOutstanding(loan){
  return Math.max(0, Number(loan?.total_payable || 0) - loanPaid(loan.id));
}
function loanExpectedCollectionAsOf(loan, asOf=todayISO()){
  const weekly = Number(loan?.weekly_installment) || 0;
  // Keep missed installments visible as arrears, but do not add them
  // to the next collection amount. Officers collect the normal installment.
  return Math.min(weekly, loanOutstanding(loan));
}
function loanExpectedCollectionOnDate(loan, asOf=todayISO()){
  if(!loan || loan.status !== 'active' || loanOutstanding(loan) <= 0) return 0;
  return loanNextDueDate(loan, asOf) === asOf ? loanExpectedCollectionAsOf(loan, asOf) : 0;
}
function expectedCollectionSummary(loans, asOf=todayISO()){
  const dueLoans = (loans || []).filter(l => loanExpectedCollectionOnDate(l, asOf) > 0);
  return {
    date: asOf,
    loans: dueLoans,
    count: dueLoans.length,
    amount: dueLoans.reduce((a,l)=>a + loanExpectedCollectionOnDate(l, asOf), 0),
    arrears: dueLoans.reduce((a,l)=>a + loanArrearsAsOf(l, asOf), 0)
  };
}
function collectionPerformance(loans, asOf=todayISO()){
  const dueLoans=(loans||[]).filter(l=>loanExpectedCollectionOnDate(l,asOf)>0);
  let dueAmount=0, paidTowardDue=0, paidCount=0;
  dueLoans.forEach(l=>{
    const due=loanExpectedCollectionOnDate(l,asOf);
    const paid=state.data.repayments
      .filter(r=>r.loan_id===l.id && r.status==='approved' && String(r.meeting_date||r.created_at||'').slice(0,10)===asOf)
      .reduce((sum,r)=>sum+Number(r.amount||0),0);
    dueAmount+=due;
    paidTowardDue+=Math.min(due,paid);
    if(paid>=due) paidCount++;
  });
  const unpaidAmount=Math.max(0,dueAmount-paidTowardDue);
  const rate=dueAmount>0?Math.min(100,(paidTowardDue/dueAmount)*100):0;
  const arrears=(loans||[]).reduce((sum,l)=>sum+loanArrearsAsOf(l,asOf),0);
  return {dueAmount,paidTowardDue,unpaidAmount,rate,dueCount:dueLoans.length,paidCount,unpaidCount:dueLoans.length-paidCount,arrears};
}
function renderCollectionPanel(perf,date,title='Collection performance'){

      <div class="collection-metric"><div class="label">Unpaid due</div><div class="amount" style="color:${perf.unpaidAmount>0?'var(--danger)':'var(--text)'}">${KES(perf.unpaidAmount)}</div><div class="detail">${perf.unpaidCount} unpaid or part-paid</div></div>

    </div>

  </div>`;
}
function loanNextDueDate(loan, asOf=todayISO()){
  const start = localDateFromISO(loan?.start_date);
  const today = localDateFromISO(asOf);
  if(!start || !today) return null;
  for(let w = 1; w <= 1040; w++){
    const d = new Date(start);
    d.setDate(d.getDate() + 7 * w);
    const ds = localDateISO(d);
    if(ds >= asOf) return ds;
  }
  return null;
}
function loanHistoryRisk(memberId){
  const loans = state.data.loans.filter(l=>l.member_id===memberId);
  const defaults = loans.filter(l=>l.status==='defaulted');
  const lateLoans = loans.filter(l=>loanArrearsAsOf(l) > 0);
  const maxArrears = loans.reduce((max,l)=>Math.max(max, loanArrearsAsOf(l)), 0);
  if(defaults.length) return { level:'high', label:'Default history', badgeClass:'b-red', summary:`This client has ${defaults.length} defaulted loan(s). Review carefully before issuing another loan.` };
  if(lateLoans.length) return { level:'warn', label:'Delayed payments', badgeClass:'b-yellow', summary:`This client has delayed payments on ${lateLoans.length} loan(s). Current/known arrears: ${KES(maxArrears)}.` };
  if(loans.length) return { level:'good', label:'Clean repayment history', badgeClass:'b-green', summary:'No defaulted loans or current arrears found in the loan history.' };
  return { level:'none', label:'No loan history', badgeClass:'b-grey', summary:'No previous loan repayment history found.' };
}
function formatMpesaDateTime(t){
  const raw = String(t?.transaction_time || t?.trans_time || t?.created_at || '').trim();
  const compact = raw.replace(/\D/g,'');
  if(compact.length >= 14){
    const y = Number(compact.slice(0,4));
    const mo = Number(compact.slice(4,6));
    const d = Number(compact.slice(6,8));
    const h = Number(compact.slice(8,10));
    const mi = Number(compact.slice(10,12));
    const s = Number(compact.slice(12,14));
    const dt = new Date(y, mo - 1, d, h, mi, s);
    if(!Number.isNaN(dt.getTime())) return dt.toLocaleString('en-KE', { dateStyle:'medium', timeStyle:'short' });
  }
  if(raw){
    const dt = new Date(raw);
    if(!Number.isNaN(dt.getTime())) return dt.toLocaleString('en-KE', { dateStyle:'medium', timeStyle:'short' });
  }
  return ' - ';
}
function mpesaTxnDateISO(t){
  const raw = String(t?.transaction_time || t?.trans_time || t?.created_at || '').trim();
  const compact = raw.replace(/\D/g,'');
  if(compact.length >= 8) return `${compact.slice(0,4)}-${compact.slice(4,6)}-${compact.slice(6,8)}`;
  if(raw){
    const dt = new Date(raw);
    if(!Number.isNaN(dt.getTime())) return dt.toISOString().slice(0,10);
  }
  return '';
}
function mpesaTxnSortTime(t){
  const raw = String(t?.transaction_time || t?.trans_time || t?.created_at || '').trim();
  const compact = raw.replace(/\D/g,'');
  if(compact.length >= 14){
    const dt = new Date(Number(compact.slice(0,4)), Number(compact.slice(4,6))-1, Number(compact.slice(6,8)), Number(compact.slice(8,10)), Number(compact.slice(10,12)), Number(compact.slice(12,14)));
    return dt.getTime() || 0;
  }
  const dt = new Date(raw);
  return Number.isNaN(dt.getTime()) ? 0 : dt.getTime();
}
function cleanMpesaReference(value){
  return String(value || '').replace(/[^0-9A-Za-z]/g, '').toUpperCase();
}
function reconciliationForMpesaTransaction(txn){
  const ref = cleanMpesaReference(txn?.trans_id);
  if(!ref) return null;
  return (state.data.reconciliations || []).find(r => cleanMpesaReference(r.mpesa_reference) === ref) || null;
}
function unlinkedGroupMpesaTransactions(groupIds=null){
  const allowed = groupIds ? new Set(groupIds) : null;
  return (state.data.mpesaTransactions || [])
    .filter(t => t.transaction_type === 'group_remittance')
    .filter(t => t.group_id && (!allowed || allowed.has(t.group_id)))
    .filter(t => !reconciliationForMpesaTransaction(t))
    .slice()
    .sort((a,b) => mpesaTxnSortTime(b) - mpesaTxnSortTime(a));
}
function loanPerformance(loan){
  if(!loan) return { score:null, label:'No active loan', badgeClass:'b-grey', summary:'No active loan to rate.', progressPct:0, arrears:0, outstanding:0 };
  const paid = loanPaid(loan.id);
  const totalPayable = Number(loan.total_payable || 0);
  const weekly = Number(loan.weekly_installment || 0);
  const outstanding = Math.max(0, totalPayable - paid);
  const expectedPaid = loanExpectedPaidAsOf(loan);
  const arrears = Math.max(0, expectedPaid - paid);
  const score = expectedPaid > 0 ? Math.min(100, Math.round((paid / expectedPaid) * 100)) : 100;
  const progressPct = totalPayable > 0 ? Math.min(100, Math.round((paid / totalPayable) * 100)) : 0;
  let label = 'Poor', badgeClass = 'b-red';
  if(loan.status === 'completed' && outstanding <= 0){
    label = 'Excellent'; badgeClass = 'b-green';
  }else if(loan.status === 'defaulted'){
    label = 'Poor'; badgeClass = 'b-red';
  }else if(score >= 95 && arrears === 0){
    label = 'Excellent'; badgeClass = 'b-green';
  }else if(score >= 80){
    label = 'Good'; badgeClass = 'b-blue';
  }else if(score >= 60){
    label = 'Fair'; badgeClass = 'b-yellow';
  }
  const summary = arrears > 0
    ? `${score}% of expected payments made - ${KES(arrears)} behind`
    : `${score}% of expected payments made - on track`;
  return { paid, totalPayable, outstanding, expectedPaid, arrears, score, progressPct, label, badgeClass, summary };
}
function memberPerformance(memberId){
  const loans = state.data.loans
    .filter(l=>l.member_id===memberId)
    .sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));
  if(!loans.length) return { score:null, label:'No loan history', badgeClass:'b-grey', summary:'No loan performance history yet.', source:'No loan' };
  const active = loans.find(l=>l.status==='active');
  const selected = active || loans[0];
  return {...loanPerformance(selected), loan:selected, source:active?'Active loan':'Latest loan' };
}
function memberEligible(memberId){
  const t = Number(state.settings?.savings_threshold || 1600);

}

}

/* =====================================================================
 * MONTHLY ADMIN BILLING LOCK
 * ===================================================================== */
const BILLING_FIRST_CYCLE = '2026-10-01';
const BILLING_LOCK_DAY = 3;
function billingTodayParts(){
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'Africa/Nairobi', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
  const pick = t => parts.find(p=>p.type===t)?.value;
  return { year: pick('year'), month: pick('month'), day: Number(pick('day')||1) };
}
function billingMonthISO(){ const d = billingTodayParts(); return `${d.year}-${d.month}-01`; }
function billingDateISO(parts = billingTodayParts()){ return `${parts.year}-${parts.month}-${String(parts.day).padStart(2,'0')}`; }
function billingWindow(paid=false, parts=billingTodayParts()){
  const started = billingDateISO(parts) >= BILLING_FIRST_CYCLE;
  return { started, reminder: started && !paid && parts.day < BILLING_LOCK_DAY, locked: started && !paid && parts.day >= BILLING_LOCK_DAY };
}
function isAdminBillingUser(){ return !!state.staff && state.staff.role === 'admin'; }
function isSubscriptionLocked(){ return isAdminBillingUser() && !!state.billing?.locked; }
function shouldShowBillingReminder(){ return isAdminBillingUser() && !!state.billing?.reminder; }
function billingReminderMinimized(){
  return sessionStorage.getItem('rh_billing_reminder_minimized') === state.billing?.cycleMonth;
}
function minimizeBillingReminder(){
  sessionStorage.setItem('rh_billing_reminder_minimized', state.billing?.cycleMonth || billingMonthISO());
  render();
}
function showBillingReminder(){
  sessionStorage.removeItem('rh_billing_reminder_minimized');
  render();
}
async function loadBillingStatus({ silent=false } = {}){
  if(!isAdminBillingUser()){
    state.billing = { status:'not_applicable', paid:true, cycleMonth:billingMonthISO(), checkedAt:new Date().toISOString(), locked:false, reminder:false, pending:false };
    return state.billing;
  }
  const cycleMonth = billingMonthISO();
  const currentWindow = billingWindow(false);
  if(!currentWindow.started){
    state.billing = { status:'not_started', paid:true, cycleMonth, checkedAt:new Date().toISOString(), locked:false, reminder:false, pending:false };
    return state.billing;
  }
  const cached = lsGet('billing_status', null);
  if(!navigator.onLine){
    const cachedPaid = cached && cached.cycleMonth === cycleMonth && cached.paid;
    const window = billingWindow(!!cachedPaid);
    state.billing = { status: cachedPaid ? 'paid' : 'offline_unverified', paid: !!cachedPaid, cycleMonth, checkedAt:new Date().toISOString(), locked:window.locked, reminder:window.reminder, pending:false };
    return state.billing;
  }
  const { data, error } = await sb.from('rh_billing_cycles').select('status,paid_at,paid_until,receipt_number,phone').eq('business_id', state.staff.business_id).eq('billing_month', cycleMonth).maybeSingle();
  if(error){
    if(!silent) toast('Could not check subscription payment status. Please try again.', 'error');
    const cachedPaid = cached && cached.cycleMonth === cycleMonth && cached.paid;
    const window = billingWindow(!!cachedPaid);
    state.billing = { status: cachedPaid ? 'paid' : 'unknown', paid: !!cachedPaid, cycleMonth, checkedAt:new Date().toISOString(), locked:window.locked, reminder:window.reminder, pending:false };
    return state.billing;
  }
  const paid = data?.status === 'paid';
  const pending = data?.status === 'pending';
  const window = billingWindow(paid);
  state.billing = { status: data?.status || 'unpaid', paid, cycleMonth, checkedAt:new Date().toISOString(), locked:window.locked, reminder:window.reminder, pending, receiptNumber: data?.receipt_number || null, paidUntil: data?.paid_until || null, phone: data?.phone || null };

}

let authMode = 'signin'; // signin | forgot | register | update_password
let authNotice = '';
function renderAuth(){

  const notice = authNotice;
  authNotice = '';
  const subtitles = {
    signin: 'Sign in to continue.',
    forgot: 'Enter your registered email to receive a password reset link.',

          </div>
        ` : authMode === 'forgot' ? `
          <form id="form-forgot">
            <div class="field"><label>Email address</label><input type="email" name="email" required /></div>
            <button class="btn btn-primary btn-block" type="submit">Send reset link</button>

          <div class="auth-sep"><span>or</span></div>

        ` : authMode === 'update_password' ? `
          <form id="form-update-password">
            <div class="field"><label>New Password</label><input type="password" id="upw-new" name="password" required minlength="8" autocomplete="new-password" /></div>
            <div class="field"><label>Confirm New Password</label><input type="password" id="upw-confirm" name="password_confirm" required minlength="8" autocomplete="new-password" /></div>
            <button class="btn btn-primary btn-block" type="submit">Update Password</button>
          </form>
        ` : `
          <form id="form-register">
            <div class="field"><label>Business name</label><input type="text" name="businessName" required placeholder="Registered trading name" /></div>
            <div class="field"><label>Administrator full name</label><input type="text" name="adminName" required /></div>
            <div class="field"><label>Administrator email address</label><input type="email" name="email" required autocomplete="email" /></div>
            <div class="field"><label>Password</label><input type="password" name="password" required minlength="8" autocomplete="new-password" /><div class="muted" style="font-size:11px;margin-top:4px">Minimum 8 characters.</div></div>
            <div class="field"><label>Business registration key</label><input type="text" name="key" required placeholder="Issued by Rhostine Limited Groups" autocomplete="off" /></div>
            <button class="btn btn-primary btn-block" type="submit">Register business</button>
          </form>
          <div class="auth-sep"><span>or</span></div>
          <button class="btn btn-outline btn-block" onclick="authMode='signin';renderAuth()">Back to sign in</button>
        `}
        <div class="muted" style="text-align:center;margin-top:18px;font-size:11px">
          ${navigator.onLine ? 'Connected' : 'Offline mode - cached credentials accepted'}
        </div>
        <div style="text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:10px;color:var(--text-muted);letter-spacing:0.03em">
          Powered by <strong style="color:var(--text-muted)">Rudder Research and Data Analytics LTD</strong>
        </div>
      </div>
    </div>`;

  if(authMode === 'signin'){
    $('form-signin').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in';
      const res = await signIn(fd.get('email'), fd.get('password'));
      if(!res.ok){
        $('auth-msg').innerHTML = `<div class="auth-error">${res.error}</div>`;
        btn.disabled = false; btn.innerHTML = 'Sign in';
      } else if(res.offline){
        $('auth-msg').innerHTML = `<div class="auth-info">Signed in offline. Data will synchronise when connection returns.</div>`;
      }
    });
  } else if(authMode === 'forgot'){
    $('form-forgot').addEventListener('submit', async e => {
      e.preventDefault();
      const email = new FormData(e.target).get('email');
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: authRedirectUrl() });
      if(error) $('auth-msg').innerHTML = `<div class="auth-error">${error.message}</div>`;
      else $('auth-msg').innerHTML = `<div class="auth-info">If an account exists for that address, a reset link has been sent.</div>`;
    });
  } else if(authMode === 'update_password'){
    $('form-update-password').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const newPassword = $('upw-new').value;
      const confirmPassword = $('upw-confirm').value;
      if(newPassword !== confirmPassword){
        $('auth-msg').innerHTML = `<div class="auth-error">Passwords do not match. Please try again.</div>`;
        return;
      }
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Updating';
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if(error){
        $('auth-msg').innerHTML = `<div class="auth-error">${error.message}</div>`;
        btn.disabled = false; btn.innerHTML = 'Update Password';
      } else {
        toast('Password updated successfully. Welcome!', 'success');
        e.target.reset();
        authMode = 'signin';
        await afterLogin(false);
      }
    });
  } else {
    $('form-register').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Registering';
      const res = await registerBusiness({
        businessName: (fd.get('businessName')||'').trim(),
        adminName: (fd.get('adminName')||'').trim(),
        email: fd.get('email'),
        password: fd.get('password'),
        key: (fd.get('key')||'').trim()
      });
      if(!res.ok){
        $('auth-msg').innerHTML = `<div class="auth-error">${res.error}</div>`;
        btn.disabled = false; btn.innerHTML = 'Register business';
      } else if(res.signedIn){
        toast('Business registered and signed in successfully.', 'success');
      } else {
        $('auth-msg').innerHTML = `<div class="auth-info">${res.requiresEmailConfirmation ? 'Registration received. Open the confirmation email sent by Supabase and confirm the address. The confirmation link will bring you back here to sign in.' : 'Business registered successfully. You may now sign in.'}</div>`;
        e.target.reset();
        if(res.requiresEmailConfirmation){
          btn.disabled = false; btn.innerHTML = 'Register business';
        } else {
          setTimeout(()=>{ authMode='signin'; renderAuth(); }, 1800);
        }
      }
    });
  }
}

/* =====================================================================

 * ===================================================================== */
function modal({ title, body, actions=[], size='' }){
  const root = $('modal-root');
  root.innerHTML = `
    <div class="modal-back show" id="modal-back">
      <div class="modal ${size}">
        <div class="modal-head"><h3>${title}</h3><button class="x-btn" onclick="closeModal()" aria-label="Close" title="Close">&times;</button></div>
        <div class="modal-body">${body}</div>
        ${actions.length ? `<div class="modal-foot">${actions.map((a,i)=>`<button class="btn ${a.cls||'btn-outline'}" data-act="${i}">${a.label}</button>`).join('')}</div>` : ''}
      </div>
    </div>`;
  actions.forEach((a,i) => {
    root.querySelector(`[data-act="${i}"]`).addEventListener('click', () => a.onClick && a.onClick());
  });
}
function closeModal(){ $('modal-root').innerHTML = ''; }
function confirmDialog(message, onYes, { title='Confirm', danger=false } = {}){
  modal({
    title,
    body: `<p style="margin:0;color:var(--text)">${message}</p>`,
    actions: [
      { label:'Cancel', cls:'btn-outline', onClick: closeModal },
      { label: danger?'Delete':'Confirm', cls: danger?'btn-danger':'btn-primary', onClick: ()=>{ closeModal(); onYes(); } }
    ]
  });
}

/* ----- Action menu (fixed positioning) ----- */
function showActMenu(ev, items){
  const root = $('actmenu-root');
  root.innerHTML = `<div class="act-menu show" id="act-menu">
    ${items.map((it,i) => it === 'sep'
      ? `<div class="sep"></div>`
      : `<button class="${it.danger?'danger':''}" data-i="${i}">${it.label}</button>`).join('')}
  </div>`;
  const m = $('act-menu');
  const r = ev.currentTarget.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 4, window.innerHeight - m.offsetHeight - 10) + 'px';
  m.style.left = Math.min(r.left, window.innerWidth - m.offsetWidth - 10) + 'px';
  items.forEach((it,i) => {
    if(it==='sep') return;
    m.querySelector(`[data-i="${i}"]`).addEventListener('click', ()=>{ root.innerHTML=''; it.onClick(); });
  });
  setTimeout(() => document.addEventListener('click', closeActMenu, { once:true }), 0);
}
function closeActMenu(){ $('actmenu-root').innerHTML = ''; }

let _mpSavingsFilter = 'all';
let _mpSavingsCustomStart = '', _mpSavingsCustomEnd = '';

function dashDateRange(){
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const today = iso(now);
  if(_dashFilter==='today') return { start: today, end: today };
  if(_dashFilter==='yesterday'){
    const y = new Date(now); y.setDate(y.getDate()-1); const yd = iso(y);
    return { start: yd, end: yd };
  }
  if(_dashFilter==='week'){
    const d = new Date(now); d.setDate(d.getDate()-6);
    return { start: iso(d), end: today };
  }
  if(_dashFilter==='month'){
    const d = new Date(now); d.setMonth(d.getMonth()-1);
    return { start: iso(d), end: today };
  }
  if(_dashFilter==='3months'){
    const d = new Date(now); d.setMonth(d.getMonth()-3);
    return { start: iso(d), end: today };
  }
  if(_dashFilter==='custom'){
    return { start: _dashCustomStart||today, end: _dashCustomEnd||today };
  }
  return { start: today, end: today };
}

function arrearDateRange(){
  // Returns a date range for filtering loan start_dates in the arrears view.
  // 'all' means no restriction (show all active loans regardless of start date).
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  const today = iso(now);
  if(_arrearsFilter === 'all') return { start: '2000-01-01', end: '2999-12-31' };
  if(_arrearsFilter === 'week'){
    const d = new Date(now); d.setDate(d.getDate()-6);
    return { start: iso(d), end: today };
  }
  if(_arrearsFilter === 'month'){
    const d = new Date(now); d.setMonth(d.getMonth()-1);
    return { start: iso(d), end: today };
  }
  if(_arrearsFilter === '3months'){
    const d = new Date(now); d.setMonth(d.getMonth()-3);
    return { start: iso(d), end: today };
  }
  if(_arrearsFilter === '6months'){
    const d = new Date(now); d.setMonth(d.getMonth()-6);
    return { start: iso(d), end: today };
  }
  if(_arrearsFilter === 'custom'){
    return { start: _arrearsCustomStart||today, end: _arrearsCustomEnd||today };
  }
  return { start: '2000-01-01', end: '2999-12-31' };
}

function pageDashboard(){
  const isAdmin = state.staff.role === 'admin';
  if(!isAdmin){ pageOfficerDashboard(); return; }
  if(!['overview','collections','portfolio','officers'].includes(_dashTab)) _dashTab='overview';

  const { start, end } = dashDateRange();
  // Robust inRange: compare date strings directly (YYYY-MM-DD), with a fallback
  // that also matches records whose created_at timestamp falls in the range (handles
  // timezone edge-cases where meeting_date may be off by one day).
  const inRange = date => {
    if(!date) return false;
    const d = date.slice(0,10); // normalise to YYYY-MM-DD
    if(d >= start && d <= end) return true;
    return false;
  };
  const inRangeFallback = (dateStr, createdAt) => {
    if(inRange(dateStr)) return true;
    if(!createdAt) return false;
    const cd = new Date(createdAt).toISOString().slice(0,10);
    return cd >= start && cd <= end;
  };

  const savings = state.data.savings.filter(s => inRangeFallback(s.meeting_date||'', s.created_at) && s.status === 'approved');
  const repayments = state.data.repayments.filter(r => inRangeFallback(r.meeting_date||'', r.created_at) && r.status === 'approved');
  const totalSavings = savings.reduce((a,b)=>a+Number(b.amount||0),0);
  const allTimeSavings = state.data.savings
    .filter(s => s.status === 'approved' && (!s.type || s.type === 'savings'))
    .reduce((a,b)=>a+Number(b.amount||0),0);
  const totalRepay = repayments.reduce((a,b)=>a+Number(b.amount||0),0);
  const activeLoans = state.data.loans.filter(l=>l.status==='active');
  const outstandingBal = activeLoans.reduce((a,l)=>a+(Number(l.total_payable||0)-loanPaid(l.id)),0);

  const eligibleCount = state.data.members.filter(m=>memberEligible(m.id)).length;
  const newMembers = state.data.members.filter(m=>inRangeFallback(m.registered_on||'',m.created_at));

    const oArrears = activeOfficerLoans.reduce((a,l)=>a+loanArrearsAsOf(l),0);
    const oExpectedCollection = expectedCollectionSummary(activeOfficerLoans, expectedDate);
    const oLoanValuePeriod = state.data.loans.filter(l=>l.officer_id===o.id && l.status==='active' && inRangeFallback(l.start_date, l.created_at)).reduce((a,b)=>a+Number(b.loan_value||0),0);
    return { name: o.full_name, savings: oSav, repayments: oRep, loans: oLoans, activeLoanCount: activeOfficerLoans.length, outstanding: oOutstanding, arrears: oArrears, expectedCollection: oExpectedCollection.amount, expectedCount: oExpectedCollection.count, loanValuePeriod: oLoanValuePeriod };
  }).sort((a,b)=>b.savings-a.savings);

function dashArrFilter(){
  const offSel   = document.getElementById('dash-arr-officer');
  const rangeSel = document.getElementById('dash-arr-range');
  const body     = document.getElementById('dash-arr-body');
  const sub      = document.getElementById('dash-arr-sub');
  if(!body) return;

  const offVal   = offSel   ? offSel.value   : '';
  const rangeVal = rangeSel ? rangeSel.value : 'all';
  const today     = todayISO();
  const msPerWeek = 7 * 24 * 3600 * 1000;
  const now = new Date();
  const iso = d => d.toISOString().slice(0,10);
  let drStart = '2000-01-01', drEnd = '2999-12-31';
  if(rangeVal === 'week')    { const d=new Date(now); d.setDate(d.getDate()-6); drStart=iso(d); drEnd=today; }
  if(rangeVal === 'month')   { const d=new Date(now); d.setMonth(d.getMonth()-1); drStart=iso(d); drEnd=today; }
  if(rangeVal === '3months') { const d=new Date(now); d.setMonth(d.getMonth()-3); drStart=iso(d); drEnd=today; }
  if(rangeVal === '6months') { const d=new Date(now); d.setMonth(d.getMonth()-6); drStart=iso(d); drEnd=today; }
  const nextWeekISO = new Date(new Date(today).getTime() + 7*24*3600*1000).toISOString().slice(0,10);

  const activeLoans = state.data.loans.filter(l => l.status === 'active' && l.start_date >= drStart && l.start_date <= drEnd);
  const rows = activeLoans.map(l => {
    const paid      = loanPaid(l.id);
    const startDate = new Date(l.start_date);
    const weeksElapsed = Math.max(0, Math.floor((new Date(today) - startDate) / msPerWeek));
    const weekly    = Number(l.weekly_installment) || 0;
    const expectedPaid = Math.min(weeksElapsed * weekly, Number(l.total_payable) || 0);
    const arrears   = Math.max(0, expectedPaid - paid);

    let nextDueDate = null;
    for (let w = 1; w <= 1040; w++) {
      const d = new Date(startDate); d.setDate(d.getDate() + 7 * w);
      const ds = d.toISOString().slice(0,10);
      if (ds >= today) { nextDueDate = ds; break; }
    }

    let category = 'ontrack';
    if (arrears > 0) category = 'arrears';
    else if (nextDueDate === today) category = 'duetoday';
    else if (nextDueDate && nextDueDate <= nextWeekISO) category = 'duethisweek';

    return { l, arrears, nextDueDate, category };
  }).filter(r => r.category !== 'ontrack');

  const filtered = offVal ? rows.filter(r => r.l.officer_id === offVal) : rows;
  const catOrder = { arrears:0, duetoday:1, duethisweek:2 };
  const display  = filtered.slice().sort((a,b)=>(catOrder[a.category]||3)-(catOrder[b.category]||3)).slice(0,10);

  if(sub) sub.textContent = filtered.length + ' loan' + (filtered.length!==1?'s':'') + ' need attention';

  if(!display.length){
    body.innerHTML = '<tr><td colspan="6"><div class="empty" style="padding:16px 0"><h4>All loans on track \u2713</h4></div></td></tr>';
    return;
  }
  body.innerHTML = display.map(function(row){
    const l = row.l, arrears = row.arrears, nextDueDate = row.nextDueDate, category = row.category;
    const mem = state.data.members.find(function(x){ return x.id===l.member_id; });
    const off = state.data.staff.find(function(x){ return x.id===l.officer_id; });
    const badgeCls = category==='arrears'?'b-red':category==='duetoday'?'b-yellow':'b-green';
    const badgeTxt = category==='arrears'?'In Arrears':category==='duetoday'?'Due Today':'Due Soon';
    return '<tr>'
      + '<td><b>' + (mem ? mem.full_name : '\u2014') + '</b></td>'
      + '<td>' + loanLabel(l) + '</td>'
      + '<td style="font-size:12px;color:var(--text-muted)">' + (off ? off.full_name : '\u2014') + '</td>'
      + '<td class="num"><b style="color:' + (arrears>0?'var(--danger)':'inherit') + '">' + KES(arrears) + '</b></td>'
      + '<td>' + fmtDate(nextDueDate) + '</td>'
      + '<td><span class="badge ' + badgeCls + '">' + badgeTxt + '</span></td>'
      + '</tr>';
  }).join('');
}

async function backfillGroupCodes(){
  const missing = state.data.groups.filter(g=>!g.group_code);
  if(!missing.length) return toast('All groups already have an M-Pesa code.','success');
  if(!(await ensureFreshToken())) return;
  let okCount = 0;
  for(const g of missing){
    const code = generateGroupCode();
    const { error } = await sb.from('rh_groups').update({ group_code: code }).eq('id', g.id);
    if(!error){ g.group_code = code; okCount++; }
  }
  audit('backfill_group_codes','rh_groups',null,null,{ count: okCount });
  render();
  toast(`Generated M-Pesa codes for ${okCount} group(s).`,'success');
}

        </tr></thead>
        <tbody>

            const g = state.data.groups.find(x=>x.id===m.group_id);

              <td>${m.national_id}</td>
              <td>${g?.name||' - '}</td>
              <td class="num">${KES(sv)}</td>
              <td>${elig?'<span class="badge b-green">Eligible</span>':'<span class="badge b-grey">Not yet</span>'}</td>
              <td>${ln?'<span class="badge b-blue">Active</span>':'<span class="badge b-grey">None</span>'}</td>

    memGrpSearch.addEventListener('focus', () => showMemGrpDrop(memGrpSearch.value));

function memberActions(ev, id){
  const m = state.data.members.find(x=>x.id===id);
  if(!m) return;
  const isAdmin = state.staff.role==='admin';

  // Check if any other member shares the same national_id or full_name+phone
  const duplicates = state.data.members.filter(x =>
    x.id !== id && (
      (m.national_id && x.national_id && x.national_id === m.national_id) ||
      (m.full_name && m.phone && x.full_name === m.full_name && x.phone === m.phone)
    )
  );
  const isDuplicate = duplicates.length > 0;
  const dupNote = isDuplicate
    ? `Warning:  This record shares ${duplicates[0].national_id === m.national_id ? 'a National ID' : 'the same name and phone'} with <b>${duplicates[0].full_name}</b> (ID: ${duplicates[0].national_id||' - '}).`
    : 'No automatic duplicate detected - proceed only if you are certain this is an erroneous entry.';

  showActMenu(ev, [
    { label:'View profile', onClick: ()=>{ go('memberProfile', { memberId: id }); } },
    { label:'Edit details', onClick: ()=>openMemberEdit(m) },
    'sep',...(isAdmin ? [
      { label:'Deactivate member', danger:true, onClick: ()=>confirmDialog(
        `Deactivate "${m.full_name}"? They will no longer appear in active member lists.`,
        async()=>{
          const { error } = await sb.from('rh_members').update({ status:'inactive' }).eq('id',id);
          if(error) return toast(error.message,'error');
          m.status='inactive'; audit('deactivate','rh_members',id); render(); toast('Member deactivated','success');
        }, { title:'Deactivate member', danger:true })
      },
      {
        label: isDuplicate ? ' Delete Duplicate Member' : ' Delete Member',
        danger: true,
        onClick: () => confirmDialog(
          `<b>Permanently delete "${m.full_name}"?</b><br><br>${dupNote}<br><br>` +
          `This will <b>permanently remove</b> the member record. Any loans, savings, or repayments linked to this record will be orphaned. This action cannot be undone.`,
          async () => {
            if(!(await ensureFreshToken())) return;
            const { error } = await sb.from('rh_members').delete().eq('id', id);
            if(error) return toast('Delete failed: ' + error.message, 'error');
            state.data.members = state.data.members.filter(x => x.id !== id);
            audit('delete_member', 'rh_members', id, { full_name: m.full_name, national_id: m.national_id, was_duplicate: isDuplicate }, null);
            render();
            toast(`Member "${m.full_name}" permanently deleted.`, 'warn');
          },
          { title: isDuplicate ? 'Delete Duplicate Member' : 'Delete Member', danger: true }
        )
      }
    ] : [])
  ]);
}

    const availableGroups = isAdmin

function saveWizardStep(){
  const d = state._wizardData;
  const s = state._wizardStep;
  if(s===1){
    ['full_name','national_id','date_of_birth','gender','phone','email','address','nearest_town','occupation','employer','income_estimate'].forEach(k => {
      const el = document.getElementById('w-'+k); if(el) d[k] = el.value;
    });
    d.phone = normalisePhone(d.phone);
    if(!d.full_name || !d.national_id || !d.phone){ toast('Full name, National ID and phone are required.','error'); return false; }
    const dup = state.data.members.find(m => m.national_id === d.national_id);
    if(dup){ toast('A member with this National ID already exists.','error'); return false; }
  }
  if(s===2){
    d.group_id = $('w-group_id').value;
    d.registration_fee = parseFloat($('w-registration_fee').value)||0;
    d.registered_on = $('w-registered_on').value;
    d.officer_id = $('w-officer_id').value;
    if(!d.group_id){ toast('Please select a group.','error'); return false; }
  }
  if(s===3){
    document.querySelectorAll('[data-g]').forEach(el => {
      d.guarantors[parseInt(el.dataset.g)][el.dataset.f] = el.value;
    });
    const g1 = d.guarantors[0];
    if(!g1.full_name || !g1.national_id || !g1.phone){ toast('At least one complete guarantor is required.','error'); return false; }
  }
  return true;
}

function removeGuarantor(i){ saveWizardStep(); state._wizardData.guarantors.splice(i,1); renderWizard(); }

async function submitWizard(){
  if(!(await ensureFreshToken())) return;
  const d = state._wizardData;
  const g = state.data.groups.find(x=>x.id===d.group_id);
  const officer_id = d.officer_id || g?.officer_id || null;

  const memberRow = {
    business_id: state.staff.business_id || null,
    group_id: d.group_id, full_name: d.full_name, national_id: d.national_id,
    date_of_birth: d.date_of_birth || null, gender: d.gender, phone: d.phone, email: d.email || null,
    address: d.address || null, nearest_town: d.nearest_town || null, occupation: d.occupation || null,
    employer: d.employer || null, income_estimate: d.income_estimate ? Number(d.income_estimate) : null,
    registration_fee: Number(d.registration_fee)||0, registered_on: d.registered_on, officer_id, status:'active'
  };

  const { data: created, error } = await sb.from('rh_members').insert(memberRow).select().single();
  if(error) return toast(error.message, 'error');

  const guars = d.guarantors.filter(x=>x.full_name && x.national_id).map((x,i) => ({
    business_id: state.staff.business_id || null,
    member_id: created.id, full_name: x.full_name, national_id: x.national_id,
    phone: normalisePhone(x.phone), location: x.location || null,
    relationship: x.relationship || null, position: i+1
  }));
  if(guars.length){
    const { error: ge } = await sb.from('rh_guarantors').insert(guars);
    if(ge) toast('Member saved, but guarantor save failed: '+ge.message, 'warn');
    else state.data.guarantors.push(...guars);
  }
  state.data.members.unshift(created);
  audit('register_member','rh_members',created.id,null,memberRow);
  closeModal();
  toast('Member registered successfully.', 'success');
  render();
}

        row.phone = normalisePhone(row.phone);
        const { error } = await sb.from('rh_members').update(row).eq('id', m.id);

        if(gName || gPhone || gNatId){
          const gRow = {
            business_id: state.staff.business_id || null,
            member_id: m.id, full_name: gName||'', phone: gPhone||null,
            national_id: gNatId||null, position: 1
          };
          if(existingGuarantor.id){

            if(ge) toast('Member saved, but guarantor update failed: '+ge.message,'warn');
            else { Object.assign(existingGuarantor, gRow); }
          } else {
            const { data: newG, error: ge } = await sb.from('rh_guarantors').insert(gRow).select().single();
            if(ge) toast('Member saved, but guarantor save failed: '+ge.message,'warn');
            else state.data.guarantors.push(newG);
          }
        }
        audit('update','rh_members',m.id);
        closeModal(); render(); toast('Member updated','success');
      }}
    ]
  });
}

async function submitMeeting(){
  const m = state._meet;
  if(!m.groupId || !m.date) return toast('Group and date are required.', 'error');
  const members = state.data.members.filter(x=>x.group_id===m.groupId && (!x.status || x.status==='active'));

  let meetingId = null;
  const existing = state.data.meetings.find(x=>x.group_id===m.groupId && x.meeting_date===m.date);
  if(existing){ meetingId = existing.id; }
  else {
    const { data, error } = await sb.from('rh_meetings').insert({
      business_id: state.staff.business_id || null,
      group_id: m.groupId, meeting_date: m.date, recorded_by: state.staff.id
    }).select().single();
    if(error) return toast(error.message, 'error');
    meetingId = data.id; state.data.meetings.unshift(data);
  }

  const savRows = []; const repRows = [];
  for(const mem of members){
    const e = m.entries[mem.id] || {};
    if(e.absent){ continue; }
    const savStatus = state.staff.role === 'admin' ? 'approved' : 'pending';

    // 1. Regular savings
    const sav = Number(e.savings)||0;
    if(sav > 0){
      savRows.push({ business_id: state.staff.business_id||null, member_id: mem.id, group_id: m.groupId, meeting_id: meetingId, meeting_date: m.date, amount: sav, type: 'savings', recorded_by: state.staff.id, notes: e.notes||null, status: savStatus });
    }

    // 2. Registration fee installment
    const reg = Number(e.reg_installment)||0;
    if(reg > 0){
      savRows.push({ business_id: state.staff.business_id||null, member_id: mem.id, group_id: m.groupId, meeting_id: meetingId, meeting_date: m.date, amount: reg, type: 'registration', recorded_by: state.staff.id, notes: 'Registration fee installment', status: savStatus });
    }

    // 3. Loan repayments
    if(e.repayments){
      for(const [loanId, repAmount] of Object.entries(e.repayments)){
        const rep = Number(repAmount)||0;
        const ln = state.data.loans.find(l => l.id === loanId);
        if(rep > 0 && ln){
          const ir = Number(ln.total_payable) ? (Number(ln.total_payable)-Number(ln.loan_value))/Number(ln.total_payable) : 0;
          const interest = +(rep*ir).toFixed(2);
          const principal = +(rep-interest).toFixed(2);
          const repStatus = state.staff.role === 'admin' ? 'approved' : 'pending';
          repRows.push({ business_id: state.staff.business_id||null, loan_id: ln.id, member_id: mem.id, group_id: m.groupId, meeting_id: meetingId, meeting_date: m.date, amount: rep, principal, interest, recorded_by: state.staff.id, status: repStatus });
        }
      }
    }
  }

  let okSav=0, okRep=0, fail=0;
  for(const r of savRows){
    const res = await queuedInsert('rh_savings', r);
    if(res.ok){ okSav++; if(!res.queued) state.data.savings.unshift({...r, id:'tmp_'+Math.random() }); } else fail++;
  }
  for(const r of repRows){
    const res = await queuedInsert('rh_repayments', r);
    if(res.ok){ okRep++; if(!res.queued) state.data.repayments.unshift({...r, id:'tmp_'+Math.random() }); } else fail++;
  }
  audit('meeting_submit', 'rh_meetings', meetingId, null, { savings: okSav, repayments: okRep });

  for(const r of repRows){
    const ln = state.data.loans.find(l=>l.id===r.loan_id);
    if(ln && (Number(ln.total_payable) - loanPaid(ln.id)) <= 0){
      await sb.from('rh_loans').update({ status:'completed' }).eq('id', ln.id);
      ln.status='completed';
    }
  }

  const regCount = savRows.filter(r=>r.type==='registration').length;
  const savCount = savRows.filter(r=>r.type==='savings').length;
  const parts = [];
  if(savCount) parts.push(`${savCount} savings`);
  if(regCount) parts.push(`${regCount} reg. installment(s)`);
  if(okRep) parts.push(`${okRep} repayment(s)`);
  toast(`Meeting saved - ${parts.join(', ')}.${fail?' Failed: '+fail:''}`, fail?'warn':'success');
  state._meet = { groupId:'', date: todayISO(), entries:{} };
  render();
}
