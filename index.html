  const { start, end } = savingsDateRange();
  const inRange = s => {
    const d = (s.meeting_date||'').slice(0,10);
    if(d >= start && d <= end) return true;
    if(s.created_at){ const cd = new Date(s.created_at).toISOString().slice(0,10); return cd >= start && cd <= end; }
    return false;
  };
  const filtered = state.data.savings.filter(s => {
    if(!isAdmin && !myGroupIds.includes(s.group_id)) return false;
    if(!inRange(s)) return false;
    if(_savingsGroupFilter && s.group_id !== _savingsGroupFilter) return false;
    if(_savingsOfficerFilter && s.recorded_by !== _savingsOfficerFilter) return false;
    return true;
  });
  if(!filtered.length){ toast('No savings to export for the current filters.','warn'); return; }
  const rows = filtered.map(s => {
    const mem = state.data.members.find(x=>x.id===s.member_id);
    const grp = state.data.groups.find(x=>x.id===s.group_id);
    const rec = state.data.staff.find(x=>x.id===s.recorded_by);
    return { Date: s.meeting_date, Member: mem?.full_name||' - ', Group: grp?.name||' - ', Amount: Number(s.amount), 'Recorded By': rec?.full_name||' - ' };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Savings');
  XLSX.writeFile(wb, `savings_${start}_${end}.xlsx`);
  toast(`Exported ${rows.length} savings entries.`, 'success');
}

  const myGroupIds = isAdmin ? null : state.data.groups.filter(g => g.officer_id === state.staff.id).map(g => g.id);

  const { start, end } = repDateRange();
  const inRange = r => {
    const d = (r.meeting_date||'').slice(0,10);
    if(d >= start && d <= end) return true;
    if(r.created_at){ const cd = new Date(r.created_at).toISOString().slice(0,10); return cd >= start && cd <= end; }
    return false;
  };

  let filtered = state.data.repayments.filter(r => {
    if(!isAdmin && !myGroupIds.includes(r.group_id)) return false;
    if(!inRange(r)) return false;
    if(_repGroupFilter && r.group_id !== _repGroupFilter) return false;
    if(_repOfficerFilter && r.recorded_by !== _repOfficerFilter) return false;
    return true;
  });

  const groups = isAdmin
    ? state.data.groups
    : state.data.groups.filter(g => myGroupIds.includes(g.id));
  const officers = state.data.staff.filter(s => s.role === 'officer' && s.status === 'active');

  const dateFilterBtns = [
    ['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['custom','Custom Range']
  ];

  const totalAmt = filtered.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalPrincipal = filtered.reduce((a,b)=>a+Number(b.principal||0),0);
  const totalInterest = filtered.reduce((a,b)=>a+Number(b.interest||0),0);

  $('page').innerHTML = `
    <div class="page-head">
      <div><h1>Repayments Register</h1><div class="desc">${filtered.length} entries - Total ${KES(totalAmt)} - Principal ${KES(totalPrincipal)} - Interest ${KES(totalInterest)}</div></div>
      <div class="actions">
        <button class="btn btn-outline" onclick="exportRepaymentsFiltered()"> Export to Excel</button>
      </div>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
      ${dateFilterBtns.map(([k,l])=>`<button class="btn btn-sm ${_repDateFilter===k?'btn-primary':'btn-outline'}" onclick="_repDateFilter='${k}';pageRepayments()">${l}</button>`).join('')}
      ${_repDateFilter==='custom'?`
        <input type="date" id="rep-custom-start" value="${_repCustomStart}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />
        <span class="muted" style="font-size:12px">to</span>
        <input type="date" id="rep-custom-end" value="${_repCustomEnd}" style="padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text)" />
      `:''}
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
      <select style="max-width:220px;font-size:13px" onchange="_repGroupFilter=this.value;pageRepayments()">
        <option value="">All Groups</option>
        ${groups.map(g=>`<option value="${g.id}" ${_repGroupFilter===g.id?'selected':''}>${g.name}</option>`).join('')}
      </select>
      ${isAdmin ? `<select style="max-width:220px;font-size:13px" onchange="_repOfficerFilter=this.value;pageRepayments()">
        <option value="">All Officers</option>
        ${officers.map(o=>`<option value="${o.id}" ${_repOfficerFilter===o.id?'selected':''}>${o.full_name}</option>`).join('')}
      </select>` : ''}
      ${(_repGroupFilter||_repOfficerFilter)?`<button class="btn btn-sm btn-ghost" onclick="_repGroupFilter='';_repOfficerFilter='';pageRepayments()">Clear  Clear filters</button>`:''}
    </div>

    <div class="table-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Date</th><th class="sticky-name">Member</th><th>Group</th><th>Loan product</th>
          <th class="num">Total</th><th class="num">Principal</th><th class="num">Interest</th>
          <th>Status</th><th>Recorded By</th><th></th>
        </tr></thead>
        <tbody>
          ${filtered.length ? filtered.map(r => {
            const mem = state.data.members.find(x=>x.id===r.member_id);
            const grp = state.data.groups.find(x=>x.id===r.group_id);
            const ln = state.data.loans.find(x=>x.id===r.loan_id);
            const rec = state.data.staff.find(x=>x.id===r.recorded_by);
            const isPending = r.status === 'pending';
            return `<tr${isPending ? ' style="background:var(--warning-50)"' : ''}>
              <td>${fmtDate(r.meeting_date)}</td>
              <td class="sticky-name"><b>${mem?.full_name||' - '}</b><div class="muted" style="font-size:11px">${mem?.national_id||''}</div></td>
              <td>${grp?.name||' - '}</td>
              <td style="font-size:12px">${loanLabel(ln)}</td>
              <td class="num"><b>${KES(r.amount)}</b>${r.edit_notes?`<div class="muted" style="font-size:10px" title="${r.edit_notes}">Edit  edited</div>`:''}
              </td>
              <td class="num">${KES(r.principal)}</td>
              <td class="num" style="color:var(--warning)">${KES(r.interest)}</td>
              <td>${isPending ? '<span class="badge b-yellow">Pending Admin Approval</span>' : '<span class="badge b-green">Approved</span>'}</td>
              <td style="font-size:12px;color:var(--text-muted)">${rec?.full_name||' - '}</td>
              <td><button class="act-btn" onclick="repRowActions(event,'${r.id}')"> - - - </button></td>
            </tr>`;
          }).join('') : `<tr><td colspan="10"><div class="empty"><h4>No repayments found</h4><p>Try adjusting the date or filters.</p></div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  // Attach listeners for custom date range inputs (avoids year-typing issue with inline onchange)
  const repStartEl = document.getElementById('rep-custom-start');
  const repEndEl = document.getElementById('rep-custom-end');
  if(repStartEl) repStartEl.addEventListener('change', e => { _repCustomStart = e.target.value; pageRepayments(); });
  if(repEndEl) repEndEl.addEventListener('change', e => { _repCustomEnd = e.target.value; pageRepayments(); });
}

function repRowActions(ev, id){
  const rep = state.data.repayments.find(x=>x.id===id);
  const isAdmin = state.staff.role === 'admin';
  const isOfficer = state.staff.role === 'officer';
  const items = [
    { label: 'Edit  Edit entry', onClick: () => openEditRepayment(id) }
  ];
  if(isAdmin && rep && rep.status === 'pending'){
    items.push('sep');
    items.push({ label: ' Approve', onClick: async () => {
      const { error } = await sb.from('rh_repayments').update({ status: 'approved' }).eq('id', id);
      if(error) return toast(error.message, 'error');
      rep.status = 'approved';
      render();
      toast('Repayment entry approved.', 'success');
    }});
  }
  if(isAdmin || isOfficer){
    items.push('sep');
    items.push({ label: ' Delete entry', danger: true, onClick: () => confirmDialog(
      'Delete this repayment entry? This cannot be undone.',
      async () => {
        if(!(await ensureFreshToken())) return;
        const { error } = await sb.from('rh_repayments').delete().eq('id', id);
        if(error) return toast(error.message, 'error');
        state.data.repayments = state.data.repayments.filter(x => x.id !== id);
        audit('delete_repayment', 'rh_repayments', id);
        render();
        toast('Repayment entry deleted.', 'warn');
      },
      { title: 'Delete Repayment Entry', danger: true }
    )});
  }
  showActMenu(ev, items);
}

function exportRepaymentsFiltered(){
  const isAdmin = state.staff.role === 'admin';
  const myGroupIds = isAdmin ? null : state.data.groups.filter(g => g.officer_id === state.staff.id).map(g => g.id);
  const { start, end } = repDateRange();
  const inRange = r => {
    const d = (r.meeting_date||'').slice(0,10);
    if(d >= start && d <= end) return true;
    if(r.created_at){ const cd = new Date(r.created_at).toISOString().slice(0,10); return cd >= start && cd <= end; }
    return false;
  };
  const filtered = state.data.repayments.filter(r => {
    if(!isAdmin && !myGroupIds.includes(r.group_id)) return false;
    if(!inRange(r)) return false;
    if(_repGroupFilter && r.group_id !== _repGroupFilter) return false;
    if(_repOfficerFilter && r.recorded_by !== _repOfficerFilter) return false;
    return true;
  });
  if(!filtered.length){ toast('No repayments to export for the current filters.','warn'); return; }
  const rows = filtered.map(r => {
    const mem = state.data.members.find(x=>x.id===r.member_id);
    const grp = state.data.groups.find(x=>x.id===r.group_id);
    const ln = state.data.loans.find(x=>x.id===r.loan_id);
    const rec = state.data.staff.find(x=>x.id===r.recorded_by);
    return {
      Date: r.meeting_date,
      Member: mem?.full_name||' - ',
      Group: grp?.name||' - ',
      'Loan Product': loanLabel(ln),
      'Total Amount': Number(r.amount),
      Principal: Number(r.principal),
      Interest: Number(r.interest),
      'Recorded By': rec?.full_name||' - '
    };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Repayments');
  XLSX.writeFile(wb, `repayments_${start}_${end}.xlsx`);
  toast(`Exported ${rows.length} repayment entries.`, 'success');
}

function downloadCollectionSheet(targetDate, officerFilter){
  targetDate = targetDate || todayISO();
  const isAdmin = state.staff.role === 'admin';

  // Use local date parsing to avoid timezone-off-by-one issues with new Date(dateStr)
  const [yr, mo, dy] = targetDate.split('-').map(Number);
  const localDate = new Date(yr, mo - 1, dy); // local midnight
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const dow = dayNames[localDate.getDay()];

  // Filter groups by meeting_day matching the target day (case-insensitive), and by officer if set
  const matchedGroups = state.data.groups.filter(g => {
    const dayMatch = (g.meeting_day || '').trim().toLowerCase() === dow.toLowerCase();
    if(!dayMatch) return false;
    if(officerFilter) return g.officer_id === officerFilter;
    if(!isAdmin) return g.officer_id === state.staff.id;
    return true;
  });

  if(!matchedGroups.length){
    toast(`No groups meet on ${dow} (${targetDate})${officerFilter ? ' for the selected officer' : ''}.`, 'warn');
    return;
  }

  const matchedGroupIds = new Set(matchedGroups.map(g => g.id));

  const activeLoans = state.data.loans.filter(l =>
    l.status === 'active' && matchedGroupIds.has(l.group_id)
  );

  if(!activeLoans.length){
    toast(`No active loans found for groups meeting on ${dow}.`, 'warn');
    return;
  }

  const rows = activeLoans.map(l => {
    const m = state.data.members.find(x => x.id === l.member_id);
    const g = state.data.groups.find(x => x.id === l.group_id);
    const off = state.data.staff.find(x => x.id === l.officer_id);
    const weekly = Number(l.weekly_installment) || 0;
    const totalPayable = Number(l.total_payable) || 0;
    const paid = loanPaid(l.id);
    const outstanding = Math.max(0, totalPayable - paid);
    const paidInstallments = weekly > 0 ? Math.floor(paid / weekly) : 0;
    const totalInstallments = weekly > 0 ? Math.ceil(totalPayable / weekly) : 0;
    const unpaidInstallments = Math.max(0, totalInstallments - paidInstallments);
    const arrears = loanArrearsAsOf(l, targetDate);
    const todayExpected = loanExpectedCollectionAsOf(l, targetDate);

    return {
      'Client ID': m?.national_id || ' - ',
      'Client Name': m?.full_name || ' - ',
      'Group': g?.name || ' - ',
      'Officer': off?.full_name || ' - ',
      'Loan Product': loanLabel(l),
      'Outstanding Balance': Number(outstanding.toFixed(2)),
      'Installment Amount': weekly,
      'Arrears': Number(arrears.toFixed(2)),
      'Expected Today': Number(todayExpected.toFixed(2)),
      'Paid Installments': paidInstallments,
      'Unpaid Installments': unpaidInstallments,
      'Expected End Date': l.expected_end_date || ' - ',
      'Amount Collected': ''  // blank column for manual fill-in during collection
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(k.length, 18) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${dow} Collection`);
  XLSX.writeFile(wb, `collection_sheet_${dow}_${targetDate}.xlsx`);
  toast(`Collection sheet exported - ${rows.length} loan${rows.length!==1?'s':''} for ${dow} (${targetDate}).`, 'success');
}

function openStandaloneRepayment(loanId, memberId){
  const ln = state.data.loans.find(l => l.id === loanId);
  const mem = state.data.members.find(m => m.id === (memberId || ln?.member_id));
  if(!ln){ toast('Loan not found.', 'error'); return; }

  const paid = loanPaid(ln.id);
  const outstanding = Math.max(0, Number(ln.total_payable) - paid);
  const ir = Number(ln.total_payable) ? (Number(ln.total_payable) - Number(ln.loan_value)) / Number(ln.total_payable) : 0;
  const expectedNow = loanExpectedCollectionAsOf(ln);

  modal({
    title: `Record Repayment - ${loanLabel(ln)}`,
    body: `
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px;font-size:13px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div class="muted" style="font-size:11px">Member</div><div style="font-weight:600">${mem?.full_name||' - '}</div></div>
          <div><div class="muted" style="font-size:11px">Loan product</div><div style="font-weight:600">${loanLabel(ln)}</div></div>
          <div><div class="muted" style="font-size:11px">Weekly installment</div><div style="font-weight:600">${KES(ln.weekly_installment)}</div></div>
          <div><div class="muted" style="font-size:11px">Expected now</div><div style="font-weight:600;color:var(--warning)">${KES(expectedNow)}</div></div>
          <div><div class="muted" style="font-size:11px">Outstanding balance</div><div style="font-weight:600;color:var(--danger)">${KES(outstanding)}</div></div>
        </div>
      </div>
      <div class="field">
        <label>Repayment Amount (KES) *</label>
        <input type="number" id="sr-amount" min="1" max="${outstanding||999999}" step="0.01" value="${expectedNow || ln.weekly_installment}" oninput="srCalcSplit(${ir})" />
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="sr-date" value="${todayISO()}" />
      </div>
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-top:2px;font-size:13px">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px">Calculated split</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div class="muted" style="font-size:11px">Principal</div><div id="sr-principal" style="font-weight:700">${KES(+(Number(expectedNow || ln.weekly_installment)*(1-ir)).toFixed(2))}</div></div>
          <div><div class="muted" style="font-size:11px">Interest</div><div id="sr-interest" style="font-weight:700;color:var(--warning)">${KES(+(Number(expectedNow || ln.weekly_installment)*ir).toFixed(2))}</div></div>
        </div>
      </div>
    `,
    actions: [
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: 'Save Repayment', cls: 'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const amount = Number(document.getElementById('sr-amount')?.value) || 0;
        const date = document.getElementById('sr-date')?.value || todayISO();
        if(!amount || amount <= 0) return toast('Please enter a valid amount.', 'error');
        if(amount > outstanding + 1) return toast(`Amount exceeds outstanding balance of ${KES(outstanding)}.`, 'error');

        const interest = +(amount * ir).toFixed(2);
        const principal = +(amount - interest).toFixed(2);

        const row = {
          business_id: state.staff.business_id || null,
          loan_id: ln.id,
          member_id: ln.member_id,
          group_id: ln.group_id || null,
          meeting_date: date,
          amount, principal, interest,
          recorded_by: state.staff.id,
          status: state.staff.role === 'admin' ? 'approved' : 'pending'
        };

        const { data, error } = await sb.from('rh_repayments').insert(row).select().single();
        if(error) return toast(error.message, 'error');

        state.data.repayments.unshift(data);
        audit('standalone_repayment', 'rh_repayments', data.id, null, row);

        // Auto-complete loan if fully paid
        const newPaid = paid + amount;
        if(newPaid >= Number(ln.total_payable)){
          await sb.from('rh_loans').update({ status: 'completed' }).eq('id', ln.id);
          ln.status = 'completed';
          toast('Loan fully repaid and marked as completed!', 'success');
        } else {
          toast('Repayment recorded successfully.', 'success');
        }
        closeModal();
        render();
      }}
    ]
  });
}

function srCalcSplit(ir){
  const amount = Number(document.getElementById('sr-amount')?.value) || 0;
  const interest = +(amount * ir).toFixed(2);
  const principal = +(amount - interest).toFixed(2);
  const pi = document.getElementById('sr-principal'); if(pi) pi.textContent = KES(principal);
  const ii = document.getElementById('sr-interest'); if(ii) ii.textContent = KES(interest);
}

/* =====================================================================
 * FEATURE 4 & 5: EDIT SAVINGS with AUDIT TRAIL
 * ===================================================================== */
function openEditSaving(savingId){
  const canEdit = state.staff.role === 'admin' || state.staff.role === 'officer';
  if(!canEdit){ toast('You do not have permission to edit savings entries.', 'error'); return; }

  const sv = state.data.savings.find(x => x.id === savingId);
  if(!sv){ toast('Saving entry not found.', 'error'); return; }

  const mem = state.data.members.find(x => x.id === sv.member_id);

  modal({
    title: 'Edit Savings Entry',
    body: `
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;font-size:13px">
        <div><span class="muted">Member: </span><b>${mem?.full_name||' - '}</b></div>
        <div><span class="muted">Date: </span><b>${fmtDate(sv.meeting_date)}</b></div>
        <div><span class="muted">Original amount: </span><b>${KES(sv.amount)}</b></div>
      </div>
      <div class="field">
        <label>New Amount (KES) *</label>
        <input type="number" id="es-amount" min="0" step="0.01" value="${sv.amount}" required />
      </div>
      <div class="field">
        <label>Reason for Edit * <span style="color:var(--danger)">required</span></label>
        <textarea id="es-reason" rows="3" placeholder="Describe why this entry is being edited (e.g. incorrect amount entered, data correction)..." required style="resize:vertical"></textarea>
      </div>
    `,
    actions: [
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: 'Save Changes', cls: 'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const amount = Number(document.getElementById('es-amount')?.value);
        const reason = document.getElementById('es-reason')?.value.trim();
        if(!amount && amount !== 0) return toast('Please enter a valid amount.', 'error');
        if(!reason) return toast('A reason for the edit is required.', 'error');

        const oldAmount = sv.amount;
        const { error } = await sb.from('rh_savings')
          .update({ amount, edit_notes: reason })
          .eq('id', savingId);

        if(error) return toast(error.message, 'error');

        sv.amount = amount;
        sv.edit_notes = reason;
        audit('edit_saving', 'rh_savings', savingId, { amount: oldAmount }, { amount, edit_notes: reason });
        closeModal();
        render();
        toast('Savings entry updated successfully.', 'success');
      }}
    ]
  });
}

/* =====================================================================
 * FEATURE 4 & 5: EDIT REPAYMENT with AUDIT TRAIL
 * ===================================================================== */
function openEditRepayment(repaymentId){
  const canEdit = state.staff.role === 'admin' || state.staff.role === 'officer';
  if(!canEdit){ toast('You do not have permission to edit repayment entries.', 'error'); return; }

  const rep = state.data.repayments.find(x => x.id === repaymentId);
  if(!rep){ toast('Repayment entry not found.', 'error'); return; }

  const mem = state.data.members.find(x => x.id === rep.member_id);
  const ln = state.data.loans.find(x => x.id === rep.loan_id);
  const ir = ln && Number(ln.total_payable) ? (Number(ln.total_payable) - Number(ln.loan_value)) / Number(ln.total_payable) : 0;

  modal({
    title: 'Edit Repayment Entry',
    body: `
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;font-size:13px">
        <div><span class="muted">Member: </span><b>${mem?.full_name||' - '}</b></div>
        <div><span class="muted">Loan: </span><b>${loanLabel(ln)}</b></div>
        <div><span class="muted">Date: </span><b>${fmtDate(rep.meeting_date)}</b></div>
        <div><span class="muted">Original amount: </span><b>${KES(rep.amount)}</b></div>
      </div>
      <div class="field">
        <label>New Amount (KES) *</label>
        <input type="number" id="er-amount" min="0" step="0.01" value="${rep.amount}" oninput="erCalcSplit(${ir})" required />
      </div>
      <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:14px;font-size:13px">
        <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:6px">Recalculated split</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div><div class="muted" style="font-size:11px">Principal</div><div id="er-principal" style="font-weight:700">${KES(+(rep.amount*(1-ir)).toFixed(2))}</div></div>
          <div><div class="muted" style="font-size:11px">Interest</div><div id="er-interest" style="font-weight:700;color:var(--warning)">${KES(+(rep.amount*ir).toFixed(2))}</div></div>
        </div>
      </div>
      <div class="field">
        <label>Reason for Edit * <span style="color:var(--danger)">required</span></label>
        <textarea id="er-reason" rows="3" placeholder="Describe why this entry is being edited..." required style="resize:vertical"></textarea>
      </div>
    `,
    actions: [
      { label: 'Cancel', cls: 'btn-outline', onClick: closeModal },
      { label: 'Save Changes', cls: 'btn-primary', onClick: async () => {
        if(!(await ensureFreshToken())) return;
        const amount = Number(document.getElementById('er-amount')?.value);
        const reason = document.getElementById('er-reason')?.value.trim();
        if(!amount && amount !== 0) return toast('Please enter a valid amount.', 'error');
        if(!reason) return toast('A reason for the edit is required.', 'error');

        const interest = +(amount * ir).toFixed(2);
        const principal = +(amount - interest).toFixed(2);
        const oldAmount = rep.amount;

        const { error } = await sb.from('rh_repayments')
          .update({ amount, principal, interest, edit_notes: reason })
          .eq('id', repaymentId);

        if(error) return toast(error.message, 'error');

        rep.amount = amount;
        rep.principal = principal;
        rep.interest = interest;
        rep.edit_notes = reason;
        audit('edit_repayment', 'rh_repayments', repaymentId, { amount: oldAmount }, { amount, principal, interest, edit_notes: reason });
        closeModal();
        render();
        toast('Repayment entry updated successfully.', 'success');
      }}
    ]
  });
}

function erCalcSplit(ir){
  const amount = Number(document.getElementById('er-amount')?.value) || 0;
  const interest = +(amount * ir).toFixed(2);
  const principal = +(amount - interest).toFixed(2);
  const pi = document.getElementById('er-principal'); if(pi) pi.textContent = KES(principal);
  const ii = document.getElementById('er-interest'); if(ii) ii.textContent = KES(interest);
}

function exportAccountingReport(){
  const { start, end } = dashDateRange();
  const inRange = date => date >= start && date <= end;
  const wb = XLSX.utils.book_new();
  // Savings
  const savRows = state.data.savings.filter(s=>inRange(s.meeting_date||'')).map(s=>{
    const m = state.data.members.find(x=>x.id===s.member_id), g=state.data.groups.find(x=>x.id===s.group_id);
    return {Date:s.meeting_date,Group:g?.name,Member:m?.full_name,Amount:Number(s.amount)};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(savRows), 'Savings');
  // Repayments
  const repRows = state.data.repayments.filter(r=>inRange(r.meeting_date||'')).map(r=>{
    const m=state.data.members.find(x=>x.id===r.member_id);
    return {Date:r.meeting_date,Member:m?.full_name,Amount:Number(r.amount),Principal:Number(r.principal),Interest:Number(r.interest)};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(repRows), 'Repayments');
  // Loans
  const lnRows = state.data.loans.filter(l=>inRange(l.start_date||'')).map(l=>{
    const m=state.data.members.find(x=>x.id===l.member_id);
    return {Date:l.start_date,Member:m?.full_name,Product:loanLabel(l),Cycle:Number(l.loan_cycle||1),CashIssued:Number(l.loan_value),Insurance:Number(l.insurance_amount||0),Weekly:Number(l.weekly_installment)};
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(lnRows), 'Loans issued');
  XLSX.writeFile(wb, `accounting_${start}_${end}.xlsx`);
  toast('Accounting report exported','success');
}

(async function boot(){
  applyTheme();
  if(['127.0.0.1','localhost'].includes(location.hostname) && new URLSearchParams(location.search).has('preview')){
    loadLocalPreview();
    return;
  }
  // Restore session
  const { data } = await sb.auth.getSession();
  if(data.session){
    state.session = data.session;
    let ok = await loadStaff();
    let completedRegistration = false;
    if(!ok){
      const meta = data.session.user?.user_metadata || {};
      const looksLikeRegistration = !!(meta.business_name && meta.full_name);
      const provision = await provisionBusinessAdmin(data.session, looksLikeRegistration ? {key:meta.registration_key || BUSINESS_REGISTRATION_KEY} : {});
      if(provision.ok){
        ok = await loadStaff();
        completedRegistration = ok;
      }
    }
    if(!ok){ await sb.auth.signOut(); state.session=null; render(); return; }
    if(completedRegistration){
      await sb.auth.signOut();
      state.session=null; state.staff=null; state.perms=null;
      authMode='signin';
      authNotice='Email confirmed and business registration completed. Sign in with your administrator email and password.';
      renderAuth();
      return;
    }
    await loadSettings();
    await loadBillingStatus({ silent:true });
    if(isSubscriptionLocked()){ render(); return; }
    await smartLoadAll();
    setupRealtime();
    flushQueue();
  }
  render();
  // Restore view position after a page refresh
  const restoreView = sessionStorage.getItem('rh_restore_view');
  const restoreCtx = sessionStorage.getItem('rh_restore_ctx');
  if(state.session && restoreView){
    sessionStorage.removeItem('rh_restore_view');
    sessionStorage.removeItem('rh_restore_ctx');
    state.view = restoreView;
    try { state.viewCtx = restoreCtx ? JSON.parse(restoreCtx) : null; } catch{ state.viewCtx = null; }
    render();
  }
  if(!navigator.onLine) setBanner('You are offline. Cached data shown. Changes will be queued.');
})();
